<style>
/* ============ 1. Tokens: todo valor visual sale de acá ============ */
:root{
  /* Neutrales cálidos (guiño al papel de la planilla) */
  --n-0:#ffffff; --n-25:#fbfaf7; --n-50:#f4f3ee; --n-100:#ebe8df; --n-200:#dcd8cd; --n-300:#c4bfb2;
  --n-500:#585e67; --n-700:#363b42; --n-900:#17191c;
  /* Acento único: el amarillo de la planilla. Sólo para la acción principal y lo seleccionado */
  /* Colores del logo ZIGE: gris pizarra y verde oliva */
  --marca-verde:#6b7a24; --marca-azul:#2f3a4a; --azul:#2f3a4a; --azul-h:#232c38; --azul-suave:#eceee4;
  --acento:#5f6d1c; --acento-h:#4e5a16; --acento-suave:#f1f3e4; --acento-linea:#cfd5a6; --acento-tinta:#3e4712;
  /* Semánticos */
  --ok:#1b6e3f; --ok-suave:#e2f2e8;
  --warn:#7a4f00; --warn-suave:#fff0d1; --warn-linea:#f0d39a; --warn-barra:#c98200;
  --err:#a8200d; --err-suave:#fde7e3; --err-linea:#f0b9ae;
  /* Planilla */
  --trabajo:#fff3c2; --trabajo-linea:#e2b52a;
  --finde:#e4e0d5; --no-dia:#4a4f57; --feriado:#fbe9e6; --fila-hover:#fdf8e4;
  /* Barra superior */
  --top-fondo:#ffffff; --top-tinta:#363b42; --top-tenue:#6a7079; --top-hover:rgba(0,0,0,.04); --top-activo:var(--azul-suave); --top-campo:#f4f3ee; --top-borde:#dcd8cd;
  /* Grupos de artículos (categorías de datos) */
  --g-salud:#cde1f5; --g-salud-i:#0f3a63;
  --g-maternidad:#f7d2e2; --g-maternidad-i:#6d1840;
  --g-familiar:#e1d6f5; --g-familiar-i:#3f2470;
  --g-personales:#f8c38c; --g-personales-i:#5c3000;
  --g-capacitacion:#d3ebd2; --g-capacitacion-i:#1f5221;
  --g-sistema:#e3e3e3; --g-sistema-i:#33373d;
  --g-anual:#c7ebe6; --g-anual-i:#0c4f47;
  --g-sinaviso:#f3b1ab; --g-sinaviso-i:#6b0f06;
  /* Escalas */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --t-xs:.75rem; --t-sm:.875rem; --t-md:1rem; --t-lg:1.25rem; --t-xl:1.5rem; --t-2xl:2rem;
  --lh-apretado:1.15; --lh-medio:1.3; --lh-comodo:1.5;
  --r-sm:5px; --r-md:8px; --r-lg:14px; --r-full:999px;
  --sh-1:0 1px 2px rgba(20,20,20,.06),0 2px 8px rgba(20,20,20,.05);
  --sh-3:0 4px 8px rgba(0,0,0,.08),0 18px 48px rgba(0,0,0,.22);
  --velo:rgba(15,17,20,.45);
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
/* ============ 2. Base ============ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:16px}
body{margin:0;background:var(--n-50);color:var(--n-900);font:var(--t-md)/var(--lh-comodo) var(--font)}
h1,h2,h3{margin:0;line-height:var(--lh-apretado);font-weight:700}
h1{font-size:var(--t-xl);letter-spacing:-.01em} h2{font-size:var(--t-md)} h3{font-size:var(--t-md)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul);text-underline-offset:3px}
.num,td.num,th.num{font-variant-numeric:tabular-nums;text-align:right}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;vertical-align:-3px}
.ico.sm{width:15px;height:15px;vertical-align:-2px}
/* ============ 3. Layout ============ */
.top{background:var(--top-fondo);color:var(--n-900);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--n-200);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:var(--s4);padding:var(--s2) var(--s4);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:var(--s3);font-weight:700;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--top-tenue);font-size:var(--t-xs)}

.ingreso-marca .logo-zige{width:160px;height:68px}
.brand-sep{width:1px;height:30px;background:var(--n-200)}
.brand-tit{line-height:1.2}
nav.tabs{display:flex;gap:2px}
nav.tabs a{color:var(--top-tinta);text-decoration:none;padding:var(--s2) var(--s3);border-radius:var(--r-md);font-weight:500;position:relative}
nav.tabs a[aria-current=page]{background:var(--top-activo);color:var(--azul)}
nav.tabs a[aria-current=page]::after{content:"";position:absolute;left:var(--s3);right:var(--s3);bottom:-9px;height:3px;border-radius:3px 3px 0 0;background:var(--marca-verde)}
.top-tools{margin-left:auto;display:flex;gap:var(--s2);align-items:center}
.top-tools input{background:var(--top-campo);border:1px solid var(--top-borde);color:var(--n-900);border-radius:var(--r-md);padding:var(--s2) var(--s3);width:220px;min-height:40px}
.top-tools input::placeholder{color:var(--top-tenue)}
.pill{display:inline-flex;align-items:center;gap:var(--s2);border:1px solid var(--top-borde);background:var(--n-0);color:var(--top-tinta);border-radius:var(--r-full);padding:var(--s1) var(--s3);font-size:var(--t-xs);cursor:pointer;min-height:32px;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--top-tenue);flex:none}
.pill.ok .dot{background:var(--acento)}
.pill.warn{border-color:var(--warn-linea);background:var(--warn-suave)} .pill.warn .dot{background:var(--warn-barra)}
.pill.err{border-color:var(--err-linea);background:var(--err-suave)} .pill.err .dot{background:var(--err)}
main{max-width:1280px;margin:0 auto;padding:var(--s5) var(--s4) var(--s7)}
.banners{max-width:1280px;margin:0 auto;padding:var(--s3) var(--s4) 0;display:grid;gap:var(--s2)}
.banners:empty{display:none}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:var(--s4);align-items:start}
.stack{display:grid;gap:var(--s4)}
.stack.lg{gap:var(--s5)}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.flex1{flex:1;min-width:0}
input.in.w-auto,select.in.w-auto,.w-auto{width:auto}
.w-busca{max-width:340px}
.cap::first-letter{text-transform:uppercase}
.t-lg{font-size:var(--t-lg)}
.span2{grid-column:span 2}
.al-fin{align-self:end}
.mt1{margin-top:var(--s1)}
/* ============ 4. Componentes ============ */
.card{background:var(--n-0);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.card.plano{box-shadow:none;border:1px solid var(--n-100);border-radius:var(--r-md)}
.card-h{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--n-100);flex-wrap:wrap;min-height:52px}
.card-b{padding:var(--s4)}
.card-b.flush{padding:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--n-200);background:var(--n-0);border-radius:var(--r-md);padding:var(--s2) var(--s4);cursor:pointer;font-weight:600;font-size:var(--t-sm);min-height:40px;white-space:nowrap;text-decoration:none;color:var(--n-900);transition:background-color 120ms ease,border-color 120ms ease,transform 140ms var(--ease)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--azul);border-color:var(--azul);color:var(--n-0)}
.btn.accent{background:var(--acento);border-color:var(--acento);color:var(--n-0);font-weight:700}
.btn.danger{color:var(--err);border-color:var(--err-linea)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:var(--s1) var(--s3);font-size:var(--t-xs)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{border:0;background:transparent;cursor:pointer;width:36px;height:36px;border-radius:var(--r-md);display:inline-grid;place-items:center;color:var(--n-500);transition:background-color 120ms ease,transform 140ms var(--ease)}
.iconbtn:active{transform:scale(.94)}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;color:var(--n-500);font-size:var(--t-xs);font-weight:600;display:inline-flex;align-items:center;gap:2px;min-height:28px}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--n-25);border-color:var(--n-300)}
  .btn.primary:hover{background:var(--azul-h);border-color:var(--azul-h)}
  .btn.accent:hover{background:var(--acento-h);border-color:var(--acento-h)}
  .btn.danger:hover{background:var(--err-suave)}
  .btn.ghost:hover{background:var(--n-50)}
  .iconbtn:hover{background:var(--n-50);color:var(--n-900)}
  .linkbtn:hover{color:var(--n-900)}
  nav.tabs a:hover{background:var(--top-hover);color:var(--n-900)}
  .pill:hover{background:var(--top-hover)}
  table.t tr.click:hover td,.lista li.click:hover,.semana .ent:hover,.semana .nota:hover{background:var(--fila-hover)}
  table.planilla td.d:hover{box-shadow:inset 0 0 0 2px var(--n-900)}
  .opcion:hover{border-color:var(--n-900)}
}
.chip{display:inline-flex;align-items:center;gap:var(--s1);font-size:var(--t-xs);font-weight:600;padding:2px var(--s2);border-radius:var(--r-full);background:var(--n-100);color:var(--n-700);white-space:nowrap;line-height:var(--lh-medio)}
.chip.doc{background:var(--n-0);box-shadow:inset 0 0 0 1px var(--n-300)}
.chip.psa{background:var(--n-100)}
.chip.warn{background:var(--warn-suave);color:var(--warn)}
.chip.err{background:var(--err-suave);color:var(--err)}
.chip.ok{background:var(--ok-suave);color:var(--ok)}
.art{display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;font-size:var(--t-xs);font-weight:700;padding:2px 6px;border-radius:var(--r-sm);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:var(--lh-medio)}
.g-salud{background:var(--g-salud);color:var(--g-salud-i)}
.g-maternidad{background:var(--g-maternidad);color:var(--g-maternidad-i)}
.g-familiar{background:var(--g-familiar);color:var(--g-familiar-i)}
.g-personales{background:var(--g-personales);color:var(--g-personales-i)}
.g-capacitacion{background:var(--g-capacitacion);color:var(--g-capacitacion-i)}
.g-sistema{background:var(--g-sistema);color:var(--g-sistema-i)}
.g-anual{background:var(--g-anual);color:var(--g-anual-i)}
.g-sinaviso{background:var(--g-sinaviso);color:var(--g-sinaviso-i)}
.desglose{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3)}
.desglose span{display:inline-flex;align-items:center;gap:var(--s1);font-variant-numeric:tabular-nums;font-weight:600;font-size:var(--t-sm)}
.muted{color:var(--n-500)}
.small{font-size:var(--t-sm)}
.xs{font-size:var(--t-xs)}
.big{font-size:var(--t-2xl);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.banner{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4);border-radius:var(--r-md);border:1px solid;flex-wrap:wrap;font-size:var(--t-sm)}
.banner.info{background:var(--n-0);border-color:var(--n-200)}
.banner.warn{background:var(--warn-suave);border-color:var(--warn-linea)}
.banner.err{background:var(--err-suave);border-color:var(--err-linea)}
.banner .txt{flex:1;min-width:220px}
main > .aviso-linea{margin-bottom:var(--s4)}
.aviso-linea{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm);color:var(--n-500);flex-wrap:wrap}
/* Tablas */
table.t{width:100%;border-collapse:collapse}
table.t th{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--n-500);font-weight:600;text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--n-200);background:var(--n-25)}
table.t td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--n-100);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tfoot td{font-weight:700;background:var(--n-25);border-top:1px solid var(--n-200)}
th.sortable{cursor:pointer;user-select:none}
.vacio{padding:var(--s6) var(--s4);text-align:center;color:var(--n-500)}
.vacio b{display:block;color:var(--n-900);margin-bottom:var(--s1)}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--n-100)}
.lista li:last-child{border-bottom:0}
.lista li.click{cursor:pointer}
.nombre{font-weight:600}
.sub{font-size:var(--t-sm);color:var(--n-500)}
.bar{height:6px;background:var(--n-100);border-radius:var(--r-full);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--azul)}
.bar.warn i{background:var(--warn-barra)}
.bar.err i{background:var(--err)}
/* Formularios */
label.f{display:grid;gap:var(--s1);font-size:var(--t-sm);font-weight:600;color:var(--n-700)}
label.f .hint{font-weight:400;color:var(--n-500);font-size:var(--t-xs)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--n-300);border-radius:var(--r-md);padding:var(--s2) var(--s3);background:var(--n-0);min-height:42px;font-weight:400;font-size:var(--t-md)}
textarea.in{min-height:64px;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--azul);outline:3px solid var(--azul-suave);outline-offset:0}
input.in.bad{border-color:var(--err)}
.err-msg{color:var(--err);font-size:var(--t-xs);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--s3)}
.fgrid .full{grid-column:1/-1}
.fgrid.checks{gap:0 var(--s3)}
.lbl{font-size:var(--t-sm);font-weight:600;color:var(--n-700);margin-bottom:var(--s1)}
.check{display:flex;gap:var(--s2);align-items:flex-start;font-size:var(--t-sm);cursor:pointer;padding:var(--s1) 0;min-height:32px}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--azul);flex:none}
.seg{display:inline-flex;border:1px solid var(--n-200);border-radius:var(--r-md);overflow:hidden;background:var(--n-0)}
.seg button{border:0;background:transparent;padding:var(--s2) var(--s3);cursor:pointer;font-weight:600;font-size:var(--t-sm);min-height:38px}
.seg button[aria-pressed=true]{background:var(--azul);color:var(--n-0)}
.datenav{display:flex;align-items:center;gap:var(--s1)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:var(--velo);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh var(--s3);overflow:auto;animation:fade 160ms ease-out}
.modal{background:var(--n-0);border-radius:var(--r-lg);width:100%;max-width:780px;box-shadow:var(--sh-3);display:flex;flex-direction:column;max-height:92vh;animation:entrar 180ms var(--ease)}
.modal.sm{max-width:480px}
.modal-h{display:flex;align-items:center;gap:var(--s2);padding:var(--s4) var(--s5);border-bottom:1px solid var(--n-100)}
.modal-h h2{font-size:var(--t-lg)}
.modal-b{padding:var(--s5);overflow:auto;display:grid;gap:var(--s4)}
.modal-f{display:flex;gap:var(--s2);align-items:center;padding:var(--s3) var(--s5);border-top:1px solid var(--n-100);background:var(--n-25);border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes entrar{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes subir{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.resumen-lic{border-radius:var(--r-md);padding:var(--s3) var(--s4);background:var(--n-25);border:1px solid var(--n-100);display:grid;gap:6px}
.computo{font-size:var(--t-md)}
.computo b{font-size:var(--t-lg);font-variant-numeric:tabular-nums}
.msg{display:flex;gap:var(--s2);font-size:var(--t-sm);padding:6px var(--s3);border-radius:var(--r-md);align-items:flex-start}
.msg .ico{margin-top:1px}
.msg.err{background:var(--err-suave);color:var(--err)}
.msg.warn{background:var(--warn-suave);color:var(--warn)}
.msg.ok{background:var(--ok-suave);color:var(--ok)}
.msg.info{background:var(--n-50);color:var(--n-700)}
.ayuda-art{font-size:var(--t-sm);background:var(--acento-suave);border:1px solid var(--acento-linea);border-radius:var(--r-md);padding:var(--s2) var(--s3);color:var(--acento-tinta)}
.ayuda-art details summary{cursor:pointer;font-weight:600;margin-top:var(--s1)}
/* Toast */
.toast{position:fixed;right:var(--s5);bottom:var(--s5);background:var(--n-900);color:var(--n-0);padding:var(--s3) var(--s4);border-radius:var(--r-md);display:flex;gap:var(--s3);align-items:center;z-index:60;box-shadow:var(--sh-3);font-size:var(--t-sm);max-width:min(440px,calc(100vw - 32px));animation:subir 200ms var(--ease)}
.toast button{background:transparent;border:0;color:#9fd36f;font-weight:700;cursor:pointer;padding:var(--s1);min-height:32px}
/* Planilla anual */
.planilla-wrap{overflow:auto}
table.planilla{border-collapse:collapse;font-size:var(--t-sm);font-variant-numeric:tabular-nums;width:100%;table-layout:fixed}
table.planilla th,table.planilla td{border:1px solid var(--n-200);text-align:center;padding:0;height:32px;width:30px}
table.planilla thead th{background:var(--n-25);font-weight:600;color:var(--n-500);font-size:var(--t-xs)}
table.planilla th.mes{text-align:left;padding:0 var(--s2);width:112px;position:sticky;left:0;background:var(--n-25);z-index:1;font-weight:700;font-size:var(--t-xs);letter-spacing:.04em;color:var(--n-700)}
table.planilla td.d{cursor:pointer;font-weight:700}
table.planilla td.trab{background:var(--trabajo);box-shadow:inset 0 -4px 0 var(--trabajo-linea)}
table.planilla td.fs{background:var(--finde)}
table.planilla td.nd{background:var(--no-dia);cursor:default}
table.planilla td.fer{color:var(--err);background:var(--feriado)}
table.planilla td.fs.fer{background:var(--finde)}
table.planilla td.nocuenta{opacity:.5}
table.planilla td.sup{box-shadow:inset 0 0 0 2px var(--err)}
table.planilla td.hoy{box-shadow:inset 0 0 0 2px var(--n-900)}
table.planilla td.obs,table.planilla th.obs{display:none}
.planilla-pie{display:flex;gap:var(--s4);flex-wrap:wrap;align-items:flex-start;padding:var(--s3) var(--s4);border-top:1px solid var(--n-100)}
.leyenda{display:flex;gap:var(--s3);flex-wrap:wrap;font-size:var(--t-xs);align-items:center;color:var(--n-700)}
.leyenda .sw{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--n-200);vertical-align:-2px;margin-right:var(--s1)}
.leyenda .sw.finde{background:var(--finde)}
.leyenda .sw.trab{background:var(--trabajo);border-color:var(--trabajo-linea)}
.leyenda b.f{color:var(--err)}
details.feriados{font-size:var(--t-sm)}
details.feriados summary{cursor:pointer;font-weight:600;color:var(--n-700)}
details.feriados ul{columns:2 260px;margin:var(--s2) 0 0;padding-left:var(--s4);color:var(--n-700)}
/* Semana */
.semana{display:grid;grid-template-columns:repeat(5,1fr)}
.semana .dia{border-right:1px solid var(--n-100);min-height:140px;padding:var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
.semana .dia:last-child{border-right:0}
.semana .dia.hoy{background:var(--acento-suave)}
.semana .dia h4{margin:0 0 var(--s1);font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em;color:var(--n-500);font-weight:600}
.semana .dia h4 b{color:var(--n-900);font-size:var(--t-md);margin-left:2px;letter-spacing:0}
.semana .ent,.semana .nota{font-size:var(--t-sm);line-height:var(--lh-medio);display:flex;gap:6px;align-items:center;cursor:pointer;border-radius:var(--r-sm);padding:2px}
.semana .nota{color:var(--n-700);align-items:flex-start}
.semana .nota .ico{color:var(--n-500);margin-top:1px}
.semana .fer{font-size:var(--t-xs);color:var(--err);font-weight:600}
.semana .mas{margin-top:auto;padding-top:var(--s1)}
.notas-dia li{align-items:flex-start}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:var(--s1) var(--s4);font-size:var(--t-sm)}
.kv dt{color:var(--n-500)}
.kv dd{margin:0;font-weight:500}
.welcome{max-width:720px;margin:0 auto}
.welcome .opc{display:grid;gap:var(--s3)}
.opcion{display:flex;gap:var(--s3);align-items:flex-start;text-align:left;width:100%;border:1px solid var(--n-200);background:var(--n-0);border-radius:var(--r-md);padding:var(--s4);cursor:pointer;transition:border-color 120ms ease}
.opcion b{display:block}
.sec-tabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--n-200);flex-wrap:wrap}
.sec-tabs button{border:0;background:transparent;padding:var(--s3) var(--s4);cursor:pointer;font-weight:600;color:var(--n-500);border-bottom:3px solid transparent;margin-bottom:-1px;min-height:44px}
.sec-tabs button[aria-selected=true]{color:var(--n-900);border-bottom-color:var(--acento)}
td input.in,td select.in{min-height:36px;padding:var(--s1) var(--s2);font-size:var(--t-sm)}
td.art-cod{width:96px} td.art-num{width:96px} td.art-nom{min-width:240px}
.hgrid{display:grid;grid-template-columns:repeat(5,minmax(96px,1fr));gap:var(--s2);overflow-x:auto}
.hturno{margin-top:var(--s2)}
.hturno-t{font-size:var(--t-sm);font-weight:600;color:var(--n-700);margin-bottom:var(--s1)}
.modal.ancho{max-width:900px}
.hdia{min-width:0}
.hdia input.in{width:100%;min-width:0;padding:2px 4px 2px 6px;font-size:13px}
.hdia{border:1px solid var(--n-200);border-radius:var(--r-md);padding:var(--s2);display:grid;gap:var(--s1);background:var(--n-0)}
.hdia.on{border-color:var(--trabajo-linea);background:var(--acento-suave)}
.hdia label{display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:var(--t-sm);cursor:pointer;text-transform:capitalize;min-height:28px}
.hdia label input{width:18px;height:18px;accent-color:var(--n-900)}
.hdia input.in{min-height:34px;padding:2px var(--s2);font-size:var(--t-sm)}
.hdia input.in:disabled{background:var(--n-50);color:var(--n-300)}
.full{grid-column:1/-1}
#print-area{display:none}
/* ============ 5. Responsive ============ */
@media (max-width:1000px){
  .grid2{grid-template-columns:1fr}
  .top-tools input{width:160px}
}
@media (max-width:720px){
  main{padding:var(--s4) var(--s3) var(--s7)}
  .top-in{gap:var(--s2)}
  nav.tabs{order:3;width:100%;overflow:auto}
  nav.tabs a[aria-current=page]::after{bottom:-8px}
  .pill .txt{display:none}
  .top-tools input{width:120px}
  .semana{grid-template-columns:1fr}
  .semana .dia{border-right:0;border-bottom:1px solid var(--n-100);min-height:0}
  table.t.cards thead{display:none}
  table.t.cards tr{display:grid;grid-template-columns:1fr auto;padding:var(--s2) var(--s3);border-bottom:1px solid var(--n-100)}
  table.t.cards td{border:0;padding:2px 0;height:auto}
  table.t.cards td.hide-m{display:none}
  table.planilla{width:auto}
  .modal-b{padding:var(--s4)}
  .toast{left:var(--s3);right:var(--s3);bottom:var(--s3)}
  .span2{grid-column:auto}
  .big{font-size:var(--t-xl)}
}

/* ============ 7. Tema visual estilo shadcn/ui ============ */
:root{
  /* Paleta */
  --n-50:hsl(45 20% 96%); --n-25:hsl(45 20% 98%); --n-100:hsl(42 14% 90%);
  --n-200:hsl(42 14% 84%); --n-300:hsl(42 12% 76%);
  --n-500:hsl(215 8% 38%); --n-700:hsl(216 9% 24%); --n-900:hsl(216 10% 10%);
  /* Colores del logo ZIGE: gris pizarra (selección) y verde oliva (acción principal) */
  --azul:hsl(215 22% 24%); --azul-h:hsl(215 24% 18%); --azul-suave:hsl(215 22% 24% / .09);
  --acento:hsl(70 59% 27%); --acento-h:hsl(70 60% 21%);
  --hoy-fondo:hsl(70 59% 27% / .06); --hecho-fondo:hsl(70 59% 27% / .15); --hecho-tinta:hsl(70 60% 20%);
  --marca-verde:hsl(70 55% 31%); --marca-azul:hsl(215 22% 24%);
  --err:hsl(8 85% 35%); --err-suave:hsl(8 85% 35% / .08); --err-linea:hsl(8 85% 35% / .30);
  --warn:#78350f; --warn-suave:#fffbeb; --warn-linea:#fcd34d;
  --gris-suave:hsl(42 14% 92%); --fila-hover:hsl(45 20% 97%); --computo-fondo:hsl(42 14% 92% / .4);
  --top-fondo:#fff; --top-borde:var(--n-200); --top-campo:#fff; --top-activo:var(--azul-suave);
  /* Formas */
  --r-sm:4px; --r-md:8px; --r-lg:8px; --r-nav:6px;
  --sh-1:0 1px 2px rgba(0,0,0,.05); --sh-seg:0 1px 2px rgba(0,0,0,.08);
  --sh-3:0 10px 38px -10px rgba(0,0,0,.25),0 10px 20px -15px rgba(0,0,0,.2);
  /* Medidas */
  --alto-ctl:36px; --lateral:232px; --contenido:1180px; --gutter:32px; --fila:48px;
  --t-titulo:24px; --t-card:16px; --t-kpi-l:12px; --t-kpi-n:30px; --t-modal:18px;
  --dur:150ms;
}
html{font-size:15px}
h1{font-size:var(--t-titulo);letter-spacing:-.01em}
h1::first-letter{text-transform:uppercase}
.card-h h2,.card-h h3{font-size:var(--t-card);font-weight:600}
.num,td.num,th.num,.big,.kpi-n{font-variant-numeric:tabular-nums}
.ico{width:16px;height:16px;vertical-align:-3px}
/* Tarjetas */
.card{border:1px solid var(--n-200);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.card-h{border-bottom-color:var(--n-200)}
/* Botones */
.btn{min-height:var(--alto-ctl);height:var(--alto-ctl);padding:0 16px;gap:8px;font-size:14px;font-weight:600;border-radius:var(--r-md);border-color:var(--n-200);background:#fff;transition:background-color var(--dur) ease,border-color var(--dur) ease,color var(--dur) ease,transform var(--dur) ease}
.btn:active:not(:disabled),.iconbtn:active{transform:scale(.97)}
.btn.primary{background:var(--azul);border-color:var(--azul)}
.btn.accent{background:var(--acento);border-color:var(--acento);font-weight:600}
.btn.danger{color:var(--err);border-color:var(--err-linea)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:30px;height:30px;padding:0 12px;font-size:13px}
.iconbtn{width:var(--alto-ctl);height:var(--alto-ctl);border-radius:var(--r-md);transition:background-color var(--dur) ease,transform var(--dur) ease}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--gris-suave);border-color:var(--n-200)}
  .btn.primary:hover{background:var(--azul-h);border-color:var(--azul-h)}
  .btn.accent:hover{background:var(--acento-h);border-color:var(--acento-h)}
  .btn.ghost:hover,.iconbtn:hover{background:var(--gris-suave)}
  .btn.danger:hover{background:var(--err-suave)}
  table.t tr.click:hover td,.lista li.click:hover,.semana .ent:hover,.semana .nota:hover{background:var(--fila-hover)}
  table.planilla td.d:hover{box-shadow:inset 0 0 0 2px var(--azul)}
  nav.tabs a:hover{background:var(--gris-suave);color:var(--n-900)}
}
/* Campos */
input.in,select.in,textarea.in{min-height:var(--alto-ctl);border-color:var(--n-300);border-radius:var(--r-md);padding:0 12px;font-size:14px;transition:border-color var(--dur) ease,box-shadow var(--dur) ease}
textarea.in{padding:8px 12px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--azul);outline:0;box-shadow:0 0 0 1px var(--azul)}
.top-tools input:focus{outline:0;border-color:var(--azul);box-shadow:0 0 0 1px var(--azul)}
.seg{border-radius:var(--r-md);border-color:var(--n-200)}
/* Badges y chips */
.art{border-radius:var(--r-sm)}
.chip{border-radius:999px}
/* Listas y tablas */
.lista li{min-height:var(--fila);border-bottom:0;border-top:1px solid var(--n-200);transition:background-color var(--dur) ease}
.lista li:first-child{border-top:0}
table.t th{font-size:12px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--n-500);background:transparent;border-bottom:1px solid var(--n-200);height:40px}
table.t td{height:var(--fila);border-bottom:0;border-top:1px solid var(--n-200)}
table.t tbody tr:first-child td{border-top:0}
table.t tfoot td{background:var(--n-25)}
/* Avisos */
.msg{border:1px solid transparent;padding:8px 12px}
.msg.warn{background:var(--warn-suave);color:var(--warn);border-color:var(--warn-linea)}
.msg.err{background:var(--err-suave);color:var(--err);border-color:var(--err-linea)}
.banner.warn{background:var(--warn-suave);border-color:var(--warn-linea);color:var(--warn)}
.chip.warn{background:var(--warn-suave);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-linea)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpis.tres{grid-template-columns:repeat(3,minmax(0,1fr))!important}
@media (max-width:600px){.kpis.tres{grid-template-columns:repeat(2,minmax(0,1fr))!important}.kpis.tres > :last-child{grid-column:1/-1}}
.kpi{background:#fff;border:1px solid var(--n-200);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px;display:grid;gap:6px;align-content:start}
.kpi-l{display:flex;align-items:center;gap:6px;font-size:var(--t-kpi-l);font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--n-500)}
.kpi-n{font-size:var(--t-kpi-n);font-weight:700;line-height:1.1;letter-spacing:-.02em}
.kpi-s{font-size:12px;color:var(--n-500)}
.grid2.inicio{grid-template-columns:1.25fr 1fr}
/* Trámites: SOL / SAG / UG */
.trams{display:inline-flex;gap:4px;vertical-align:middle}
.tram{width:24px;height:24px;border-radius:var(--r-sm);display:inline-grid;place-items:center;font-size:8.5px;font-weight:700;letter-spacing:.02em;background:var(--gris-suave);color:var(--n-500)}
.tram.ok{background:var(--hecho-fondo);color:var(--hecho-tinta)}
.tram .ico{width:14px;height:14px;vertical-align:0}
/* Pestañas segmentadas */
.segtabs{display:inline-flex;gap:2px;padding:3px;background:var(--gris-suave);border-radius:var(--r-md);flex-wrap:wrap}
.segtabs button{border:0;background:transparent;border-radius:6px;padding:0 12px;height:30px;font-size:14px;font-weight:500;color:var(--n-500);cursor:pointer;transition:background-color var(--dur) ease,color var(--dur) ease}
.segtabs button[aria-selected=true]{background:#fff;color:var(--n-900);box-shadow:var(--sh-seg)}
[data-tab][hidden]{display:none!important}
/* Semana */
.semana .dia{border-right-color:var(--n-200)}
.semana .dia.hoy{background:var(--hoy-fondo);box-shadow:inset 0 2px 0 var(--acento)}
/* Planilla */
table.planilla th,table.planilla td{border-color:var(--n-200);height:32px}
table.planilla td.hoy{box-shadow:inset 0 0 0 2px var(--acento)}
.planilla-info{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--n-200);min-height:44px;font-size:13px}
.planilla-info .det{flex:1;min-width:220px;color:var(--n-700)}
.planilla-info .det:empty::before{content:"Pasá el mouse por un día para ver el detalle.";color:var(--n-500)}
/* Modal */
.modal{max-width:672px;border-radius:12px;border:1px solid var(--n-200);animation:entrar var(--dur) ease-out}
.modal-bg{animation:fade var(--dur) ease-out}
.modal-h{align-items:flex-start;border-bottom-color:var(--n-200)}
.modal-h h2{font-size:var(--t-modal);font-weight:600}
.modal-sub{font-size:13px;color:var(--n-500);font-weight:400;margin-top:4px}
.modal-f{background:#fff;border-top-color:var(--n-200)}
.resumen-lic{background:var(--computo-fondo);border-color:var(--n-200)}
.computo b{font-size:20px;font-weight:700}
@keyframes entrar{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
/* Detalles (badges, chips, KPI, buscador, combobox) */
.art{min-width:52px;padding:3px 10px;border-radius:6px;font-size:13px;font-weight:600}
.chip.doc,.chip.psa{background:#fff;box-shadow:none;border:1px solid var(--n-300);border-radius:6px;color:var(--n-900);font-weight:500;font-size:13px;padding:2px 10px}
.chip.hoy{background:var(--warn-suave);color:var(--warn);border-radius:6px;font-weight:500;box-shadow:none}
.kpi.warn{border-color:var(--warn-linea)}
.kpi-n .kpi-s{font-size:14px;font-weight:500}
.nombre{font-size:16px}
.lista li{padding:12px 24px}
.card-h{padding:16px 24px;min-height:60px}
.card-h h2{font-size:17px}
.buscar{position:relative;flex:0 1 480px;min-width:220px}
.buscar .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--n-500);pointer-events:none}
.buscar input.in{padding-left:38px;height:44px;font-size:15px}
.seg{border:0;background:var(--gris-suave);padding:4px;border-radius:var(--r-md);gap:2px}

function isoToDate(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function dateToIso(dt) { return dt.toISOString().slice(0, 10); }
function sumarDias(iso, n) { const d = isoToDate(iso); d.setUTCDate(d.getUTCDate() + n); return dateToIso(d); }
function hoyISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function dow(iso) { return isoToDate(iso).getUTCDay(); }
function fmt(iso) { if (!iso) return '—'; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function fmtC(iso) { if (!iso) return '—'; const [, m, d] = iso.split('-'); return `${d}/${m}`; }
function fmtLargo(iso) { const d = isoToDate(iso); return `${DIAS[d.getUTCDay()]} ${fmt(iso)}`; }
function esISO(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false; return dateToIso(isoToDate(s)) === s; }
function diasEnMes(y, m) { return new Date(Date.UTC(y, m + 1, 0)).getUTCDate(); } // m 0-11
function lunesDe(iso) { const w = dow(iso); return sumarDias(iso, w === 0 ? -6 : 1 - w); }
function anioDe(iso) { return Number(iso.slice(0, 4)); }
function plural(n, s, p) { return `${n0(n)} ${n === 1 ? s : (p || s + 's')}`; }
function vivos(arr) { return (arr || []).filter(x => !x.borrado); }
function nombreAgente(a) { return a ? `${(a.apellido || '').toUpperCase()}, ${a.nombre || ''}`.trim() : '—'; }
function titulo(t) { return String(t || '').toLowerCase().replace(/(^|[\s'-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase()); }
function nombreBreve(a) { if (!a) return '—'; const i = (a.nombre || '').trim()[0]; return `${titulo(a.apellido)}${i ? ' ' + i.toUpperCase() + '.' : ''}`; }
function artNombre(art) { return art ? (art.corto || art.nombre) : '—'; }
function etiquetaAgente(a) { return nombreAgente(a) + (a.dni ? ` · DNI ${a.dni}` : ''); }
function normalizar(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function codigoCorto(art) { return art ? art.codigo.replace('°', '').replace(/\s+/g, '').replace('bis', 'b').replace('S/A', 'SA') : '?'; }
function unidadTxt(u, n) { return u === 'corridos' ? (n === 1 ? 'día corrido' : 'días corridos') : (n === 1 ? 'día hábil' : 'días hábiles'); }
function parseEntero(v) { const s = String(v ?? '').trim(); if (s === '') return null; const n = Number(s.replace(',', '.')); return Number.isFinite(n) && n >= 0 ? Math.round(n) : NaN; }

/* =========================================================================
   3. ESTADO Y PERSISTENCIA
   -------------------------------------------------------------------------
   Capa de datos pensada para pasar a online sin reescribir la app:
   - Toda modificación pasa por mutar() → un único punto para mandar cambios a un servidor.
   - Cada registro tiene id (UUID), creado, modificado y borrado (borrado lógico),
     que es lo que necesita una sincronización por registro.
   - El almacenamiento está separado en "adaptadores": localStorage (siempre) y
     Archivo (JSON en una carpeta, por ej. Google Drive / OneDrive de escritorio).
     Un adaptador futuro "Servidor" sólo tiene que implementar leer() / escribir().
   ========================================================================= */
function sellar(obj) { const t = ahora(); return { id: uid(), creado: t, modificado: t, borrado: false, ...obj }; }

function estadoInicial() {
  const t = ahora();
  return {
    version: SCHEMA_VERSION,
    meta: { institucion: INSTITUCION, creado: t, modificado: t, rev: 0, ultimoBackup: null, semillaArticulos: 1 },
    config: { feriadosCuentanHabiles: false, pestanas: structuredClone(PESTANAS_INICIALES) },
    articulos: SEED_ARTICULOS.map(a => ({ ...a, creado: t, modificado: t, borrado: false })),
    calendario: SEED_CALENDARIO.map(c => ({ ...c, creado: t, modificado: t, borrado: false })),
    agentes: [],
    licencias: [],

}

function esEstadoValido(d) {
  return d && typeof d === 'object' && Array.isArray(d.agentes) && Array.isArray(d.licencias)
    && Array.isArray(d.articulos) && Array.isArray(d.calendario);
}

function migrar(datos, { persistir = true } = {}) {
  const version = datos.version ?? 1;
  if (version > SCHEMA_VERSION) throw new Error('Los datos son de una versión más nueva de la app. Actualizá la app antes de abrirlos.');
  let d = datos;
  if (version < SCHEMA_VERSION && persistir) {
    try { LS.setItem(`${STORAGE_KEY}-backup-v${version}`, JSON.stringify(datos)); } catch (e) { /* sin espacio: seguimos */ }
  }
  if (version < 2) d = migrarA2(d);
  if (version < 3) d = migrarA3(d);
  if (version < 4) d = migrarA4(d);
  if (version < 5) d = migrarA5(d);
  if (version < 6) d = migrarA6(d);
  if (version < 7) d = migrarA7(d);
  if (version < 8) d = migrarA8(d);
  if (version < 9) d = migrarA9(d);
  if (version < 10) d = migrarA10(d);
  if (version < 11) d = migrarA11(d);
  // (futuras migraciones en cascada: if (version < 3) d = migrarA3(d); …)
  d.meta = { institucion: '', rev: 0, ultimoBackup: null, semillaArticulos: 1, ...d.meta };
  d.config = { feriadosCuentanHabiles: false, ...d.config };
  d.version = SCHEMA_VERSION;
  return d;
}

function turnoPorHora(desde) {

function migrarA3(d) {

function cargarLocal() {
  const crudo = LS.getItem(STORAGE_KEY);
  if (!crudo) return estadoInicial();
  let datos;
  try { datos = JSON.parse(crudo); }
  catch (e) {
    LS.setItem(STORAGE_KEY + '-corrupto-' + Date.now(), crudo);
    alert('No se pudieron leer los datos guardados en este navegador. Se preservó una copia y se empezó de cero. Si tenés el archivo de datos, abrilo desde Ajustes.');
    return estadoInicial();
  }
  if (!esEstadoValido(datos)) return estadoInicial();
  return migrar(datos);
}

let estado = null;
let modoLectura = false;
let errorGuardado = '';

function guardarLocal() {
  if (modoLectura) return;
  try { LS.setItem(STORAGE_KEY, JSON.stringify(estado)); errorGuardado = ''; }
  catch (e) { errorGuardado = 'No se pudo guardar en este navegador (' + (e.name || 'error') + '). Exportá una copia ya mismo desde Ajustes.'; }

/* Copias automáticas: una por día en el navegador (las últimas 8) */
function listarSnapshots() {
  const out = [];
  for (let i = 0; i < LS.length; i++) {
    const k = LS.key(i);
    if (k && k.startsWith(SNAP_PREFIX)) out.push(k);
  }
  return out.sort().reverse();
}
function snapshot(sufijo) {
  if (modoLectura) return;
  try {
    LS.setItem(SNAP_PREFIX + sufijo, JSON.stringify(estado));
    const todas = listarSnapshots();
    todas.slice(MAX_SNAPSHOTS).forEach(k => LS.removeItem(k));
  } catch (e) { /* sin espacio para copias: no bloquear */ }
}

/* ---------- IndexedDB (sólo para recordar el archivo vinculado) ---------- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(STORAGE_KEY, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) { if (typeof indexedDB === 'undefined') return null; const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function idbDel(k) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }

/* ---------- Adaptador Archivo (File System Access API: Chrome / Edge) ---------- */
const Archivo = {
  soportado: !EN_EMERGENCIA && typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function',
  handle: null, nombre: '', estado: 'sin-archivo', // sin-archivo | requiere-permiso | conectado | conflicto | error
  revConocida: null, ultimaEscritura: null, error: '', enDiscoConflicto: null,
  tipos: [{ description: 'Datos de licencias (.json)', accept: { 'application/json': ['.json'] } }],
  async permiso(h, modo, pedir) {
    const o = { mode: modo };
    if ((await h.queryPermission(o)) === 'granted') return true;
    if (pedir) return (await h.requestPermission(o)) === 'granted';
    return false;
  },
  async leer(h = this.handle) { const f = await h.getFile(); const txt = await f.text(); if (!txt.trim()) return null; return JSON.parse(txt); },
  async escribir(datos, h = this.handle) { const w = await h.createWritable(); await w.write(JSON.stringify(datos)); await w.close(); },
};
let timerArchivo = null;
function programarArchivo() {
  if (modoLectura || !Archivo.handle || Archivo.estado !== 'conectado') return;
  clearTimeout(timerArchivo);
  timerArchivo = setTimeout(sincronizarArchivo, 600);
}
async function sincronizarArchivo(forzar = false) {
  if (modoLectura || !Archivo.handle) return;
  try {
    let enDisco = null;
    try { enDisco = await Archivo.leer(); } catch (e) { enDisco = null; }
    const revDisco = enDisco?.meta?.rev ?? null;
    if (!forzar && enDisco && Archivo.revConocida != null && revDisco !== Archivo.revConocida) {
      Archivo.estado = 'conflicto'; Archivo.enDiscoConflicto = enDisco; renderBanners(); pintarEstadoGuardado(); return;
    }
    await Archivo.escribir(estado);
    Archivo.revConocida = estado.meta.rev; Archivo.ultimaEscritura = new Date(); Archivo.estado = 'conectado'; Archivo.error = '';
  } catch (e) {
    Archivo.estado = 'error'; Archivo.error = e.message || String(e);
  }
  renderBanners(); pintarEstadoGuardado();
}
async function vincularArchivoNuevo() {
  if (!Archivo.soportado) return toast('Este navegador no permite guardar en un archivo. Usá Chrome o Edge en la compu.');
  try {
    const h = await window.showSaveFilePicker({ suggestedName: 'licencias-datos.json', types: Archivo.tipos });
    Archivo.handle = h; Archivo.nombre = h.name; Archivo.estado = 'conectado'; Archivo.revConocida = null;
    await idbSet('archivo', h);
    await sincronizarArchivo(true);
    toast('Listo: cada cambio se guarda también en "' + h.name + '".');
    render();
  } catch (e) { if (e.name !== 'AbortError') toast('No se pudo vincular el archivo: ' + e.message); }
}
async function abrirArchivoExistente() {
  if (!Archivo.soportado) return toast('Este navegador no permite abrir el archivo vinculado. Usá Chrome o Edge, o "Importar copia".');
  try {
    const [h] = await window.showOpenFilePicker({ types: Archivo.tipos, multiple: false });
    const d = await Archivo.leer(h);
    if (!esEstadoValido(d)) return toast('Ese archivo no tiene el formato de datos de esta app.');
    const ok = await confirmar({
      titulo: 'Abrir "' + h.name + '"',
      html: `<p>El archivo tiene <b>${plural(vivos(d.agentes).length, 'agente')}</b> y <b>${plural(vivos(d.licencias).length, 'licencia')}</b> (última modificación ${fmtFechaHora(d.meta?.modificado)}).</p>
             <p>Va a reemplazar lo que hay ahora en este navegador (${plural(vivos(estado.agentes).length, 'agente')}, ${plural(vivos(estado.licencias).length, 'licencia')}). Antes se guarda una copia automática.</p>`,
      ok: 'Abrir y usar este archivo',

    out[col] = out[col] || [];

    for (const r of copia[col] || []) {

  if (art.regimen !== ag.regimen) errores.push(`El art. ${art.codigo} es de ${REGIMENES[art.regimen].largo} y el agente es ${REGIMENES[ag.regimen].corto}.`);
  const dias = diasLicencia(b, art, ctx);
  if (dias === 0) avisos.push('El rango no tiene días computables (sólo fines de semana o feriados).');
  if (art.maxPorLicencia != null && dias > art.maxPorLicencia) avisos.push(`El art. ${art.codigo} admite hasta ${art.maxPorLicencia} ${unidadTxt(art.unidad, art.maxPorLicencia)} por licencia; esta tiene ${dias}.`);
  // Topes anuales y mensuales, por cada año que toca la licencia.
  // Si el artículo cuenta por cargo (20° b), se controla cada cargo que toca la licencia por separado.
  const cargosLic = porCargo(art) ? cargosDeLicencia(b, ag) : [];
  for (const cargo of cargosLic.length ? cargosLic : [null])
  for (let y = anioDe(b.desde); y <= anioDe(b.hasta); y++) {
    const pre = cargo ? `En ${nombreCargo(cargo)} (${nombrePestana(cargo.pestana)}): ` : '';
    const u = usoArticulo(ag.id, art.id, y, ctx, { excluirId: b.id, cargoId: cargo?.id || null });
    const estaAnio = diasLicencia(b, art, ctx, `${y}-01-01`, `${y}-12-31`);
    if (art.topeAnual != null) {
      const quedan = art.topeAnual - u.total;
      const despues = u.total + estaAnio;
      if (despues > art.topeAnual) avisos.push(pre + `Supera el tope anual del art. ${art.codigo} en ${y}: ya tiene cargados ${u.total} de ${art.topeAnual} (contando todo el año); con esta quedaría en ${despues} (${despues - art.topeAnual} de más).`);
      else info.push(pre + `Art. ${art.codigo} en ${y}: tiene cargados ${u.total} de ${art.topeAnual}. Con esta: ${despues}. Le quedarían ${quedan - estaAnio}.`);
    }
    if (art.topeMensual != null) {
      const porMesEsta = Array(12).fill(0);
      const a = b.desde < `${y}-01-01` ? `${y}-01-01` : b.desde, z = b.hasta > `${y}-12-31` ? `${y}-12-31` : b.hasta;
      for (let d = a; d <= z; d = sumarDias(d, 1)) if (cuentaDia(d, art, ctx)) porMesEsta[Number(d.slice(5, 7)) - 1]++;
      porMesEsta.forEach((n, m) => {
        if (n && u.porMes[m] + n > art.topeMensual) avisos.push(pre + `Supera el máximo mensual del art. ${art.codigo} en ${MESES[m].toLowerCase()} ${y}: ${u.porMes[m] + n} de ${art.topeMensual}.`);
      });
    }
  }
  // Superposición con otras licencias del mismo agente
  const sup = ctx.licTodas.filter(l => l.agenteId === ag.id && l.id !== b.id && l.desde <= b.hasta && l.hasta >= b.desde);
  sup.forEach(l => { const a2 = ctx.arts.get(l.articuloId); avisos.push(`Se superpone con otra licencia del agente: art. ${a2 ? a2.codigo : '?'} del ${fmt(l.desde)} al ${fmt(l.hasta)}.`); });
  // Alta / baja de los cargos
  const cargos = vivos(ag.cargos);
  const elegidos = (b.cargos && b.cargos.length) ? cargos.filter(c => b.cargos.includes(c.id)) : cargos;
  elegidos.forEach(c => {
    if (c.alta && b.desde < c.alta) avisos.push(`Empieza antes del alta del cargo "${c.catedra || c.idCargo || 'sin nombre'}" (${fmt(c.alta)}).`);
    if (c.baja && b.desde > c.baja) avisos.push(`Empieza después de la baja del cargo "${c.catedra || c.idCargo || 'sin nombre'}" (${fmt(c.baja)}).`);
  });
  return { errores, avisos, info, dias, art, ag };
}

/* Horario de trabajo por turnos, de lunes (1) a viernes (5):
   cargo.horario = { 1: { m: {desde, hasta}, t: {...}, n: {...} }, 2: {...}, … } */
const TURNOS = [['m', 'Turno mañana', 'mañana'], ['t', 'Turno tarde', 'tarde'], ['n', 'Turno vespertino/noche', 'vespertino/noche']];
const DIAS_SEMANA = [1, 2, 3, 4, 5];
function turnosDeCargo(c, dia) {
  let h = (c.horario || {})[dia] || {};
  // Formato viejo ({desde, hasta} por día), por si todavía no se actualizó (p. ej. en el servidor y lo ve alguien de consulta)
  if (('desde' in h || 'hasta' in h) && !(h.m || h.t || h.n)) h = { [turnoPorHora(h.desde)]: h };
  return TURNOS.filter(([k]) => h[k]).map(([k, , corto]) => ({ turno: k, nombre: corto, desde: h[k].desde || '', hasta: h[k].hasta || '' }));
}
/* Cargos vigentes que trabajan ese día, un renglón por turno */
function turnosDelDia(ag, iso) {
  const w = dow(iso);
  const out = [];
  for (const c of vivos(ag?.cargos)) {
    if (c.alta && iso < c.alta) continue;
    if (c.baja && iso > c.baja) continue;
    for (const t of turnosDeCargo(c, w)) out.push({ cargo: c, ...t });
  }
  return out;
}
function tieneHorario(ag) { return vivos(ag?.cargos).some(c => DIAS_SEMANA.some(d => turnosDeCargo(c, d).length)); }
function textoTurnos(ts) {
  return ts.map(t => `${t.desde && t.hasta ? `${t.desde}–${t.hasta}` : 'turno ' + t.nombre}${t.cargo.catedra ? ' (' + t.cargo.catedra + ')' : ''}`).join(' · ');
}
function resumenHorario(c) {
  return DIAS_SEMANA.map(d => {
    const ts = turnosDeCargo(c, d); if (!ts.length) return '';
    return `${DIAS_C[d]} ${ts.map(t => t.desde && t.hasta ? `${t.desde}–${t.hasta}` : t.nombre).join(' y ')}`;
  }).filter(Boolean).join(' · ');
}
/* Días de trabajo (según horario) dentro de una licencia, sin contar feriados */
function diasDeTrabajoEn(lic, ag, ctx) {
  if (!tieneHorario(ag) || !esISO(lic.desde) || !esISO(lic.hasta) || lic.hasta < lic.desde) return null;
  let n = 0;
  for (let d = lic.desde; d <= lic.hasta; d = sumarDias(d, 1)) if (!diaEspecial(d, ctx, ag.regimen) && turnosDelDia(ag, d).length) n++;
  return n;
}

/* Alertas de topes para el panel de inicio */
function alertasTopes(anio, ctx) {
  const out = [];
  for (const ag of ctx.agentes) {
    for (const art of ctx.arts.values()) {
      if (art.regimen !== ag.regimen || art.topeAnual == null) continue;
      for (const cargo of porCargo(art) && vivos(ag.cargos).length ? vivos(ag.cargos) : [null]) {
        const u = usoArticulo(ag.id, art.id, anio, ctx, { cargoId: cargo?.id || null });
        if (u.total === 0) continue;
        const p = u.total / art.topeAnual;
        if (p >= 0.75) out.push({ ag, art, cargo, total: u.total, tope: art.topeAnual, p });
      }
    }
  }
  return out.sort((a, b) => b.p - a.p);
}

/* Trámites como cuadraditos: SOL / SAG / UG (verde con tilde = hecho) */
const TRAM_SIGLA = { solicitud: 'SOL', sage: 'SAG', ug: 'UG' };
function cuadritosTramite(lic, art) {
  const ks = art?.tramites || []; if (!ks.length) return '';
  const hechos = lic.tramites || {};
  return `<span class="trams">${ks.map(k => `<span class="tram ${hechos[k] ? 'ok' : ''}" title="${esc(tramLabel(k))}: ${hechos[k] ? 'hecho' : 'pendiente'}">${hechos[k] ? ico('check') : esc(TRAM_SIGLA[k] || k.slice(0, 3).toUpperCase())}</span>`).join('')}</span>`;
}
function kpi(icono, etiqueta, numero, sub = '', cls = '') {
  return `<div class="kpi ${cls}"><div class="kpi-l">${ico(icono)}${etiqueta}</div><div class="kpi-n">${numero}</div>${sub ? `<div class="kpi-s">${sub}</div>` : ''}</div>`;
}
function artBadge(art, conNombre = false) {
  if (!art) return '<span class="art g-sistema">?</span>';
  return `<span class="art g-${esc(art.grupo)}" title="${esc('Art. ' + art.codigo + ' — ' + art.nombre)}">${esc(art.codigo)}</span>${conNombre ? ` <span class="small">${esc(artNombre(art))}</span>` : ''}`;
}
function regChip() { return ''; } // hay un solo régimen: no hace falta mostrarlo
function fmtFechaHora(iso) { if (!iso) return '—'; const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function barra(total, tope) {
  if (tope == null) return '';
  const p = tope ? Math.min(1, total / tope) : 1;
  const cls = total > tope ? 'err' : p >= 0.75 ? 'warn' : '';
  return `<div class="bar ${cls}" title="${total} de ${tope}"><i style="width:${Math.round(p * 100)}%"></i></div>`;
}

/* Navegación: no depende de que el navegador procese los links con # (en algunas vistas previas no lo hace) */

function ir(ruta) {

/* Barra de pestañas: Todos + una por grupo, con la cantidad de personas y un punto si hay trámites pendientes */
function pintarPestanas(ctx) {
  const nav = $('#pestanas'); if (!nav) return;
  if (Nube.activa() && Nube.estado !== 'ok') { nav.hidden = true; return; }
  nav.hidden = false;
  const actual = ctx.pes;
  const conPend = new Set();
  for (const l of ctx.licTodas) {
    if (!tramitesPendientes(l, ctx.arts.get(l.articuloId)).length) continue;
    cargosDeLicencia(l, ctx.agIdx.get(l.agenteId)).forEach(c => conPend.add(c.pestana));
  }
  const tab = (id, nombre, det, n, pend) => `<button class="ptab ${id ? '' : 'todos'}" data-act="pestana" data-v="${esc(id)}" ${actual === id ? 'aria-current="page"' : ''}>${esc(nombre)}${det ? ` <span class="det">· ${esc(det)}</span>` : ''}${n != null ? `<span class="n">${n}</span>` : ''}${pend ? '<span class="falta" title="Hay trámites pendientes"></span>' : ''}</button>`;
  nav.innerHTML = `<div class="pestanas-in">${tab('', 'Todos', '', null, false)}${pestanas().map(p =>
    tab(p.id, p.nombre, p.detalle, ctx.agTodos.filter(a => !a.inactivo && cargosEn(a, p.id).length).length, conPend.has(p.id))).join('')}</div>`;

  if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function pintarEstadoGuardado() {

  if (NubeDatos.activos()) {
    let cls = 'ok', txt = 'Guardado en la nube';
    if (NubeDatos.error) { cls = 'err'; txt = 'No se pudo guardar'; }
    else if (!navigator.onLine) { cls = 'warn'; txt = NubeDatos.pendientes ? 'Sin conexión: se sube al volver' : 'Sin conexión'; }
    else if (NubeDatos.pendientes || !NubeDatos.listo) { cls = ''; txt = NubeDatos.listo ? 'Guardando…' : 'Cargando…'; }
    else if (modoLectura) { cls = 'ok'; txt = 'Datos al día'; }

    return;
  }
  const hh = d => d ? ` · ${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
  let cls = '', txt = '';
  if (modoLectura) { cls = ''; txt = 'Modo consulta' + hh(Consulta.cargado); }
  else if (Archivo.estado === 'conectado') { cls = 'ok'; txt = 'Guardado en archivo' + hh(Archivo.ultimaEscritura); }
  else if (['requiere-permiso', 'error', 'conflicto'].includes(Archivo.estado)) { cls = 'err'; txt = 'Archivo desconectado'; }
  else {
    const hay = vivos(estado.agentes).length > 0;
    const ult = estado.meta.ultimoBackup;
    const dias = ult ? Math.floor((Date.now() - new Date(ult)) / 864e5) : null;
    if (hay && (dias == null || dias >= 7)) { cls = 'warn'; txt = 'Sin respaldo'; } else { txt = 'Guardado en este navegador'; }
  }
  el.className = 'pill ' + cls;
  el.title = txt + ' — tocá para ver las opciones de respaldo';

}

    const donde = ctx.pes ? '' : ' · ' + [...new Set(cargosDeLicencia(l, ag).map(c => nombrePestana(c.pestana)))].join(', ');

      <div class="num small" style="display:grid;justify-items:end;gap:4px">${cuadritosTramite(l, art)}${vencido ? `<span class="chip err">Solicitud vencida</span>` : ''}</div></li>`;

      <button class="btn sm" data-act="dia" data-n="0">Hoy</button></div></div>
    ${avisoEjemplo(ctx)}
    ${fer ? `<div class="msg warn">${ico('info', 'sm')}<span><b>${esc(TIPOS_DIA[fer.tipo])}${esc(paraTxt(fer))}:</b> ${esc(fer.desc)}</span></div>` : ''}
    <div class="kpis tres">

      ${kpi('archivook', 'Trámites pendientes', pend.length, pend.length ? 'licencias sin completar' : 'todo al día', pend.length ? 'warn' : '')}

          ${notasHoy.length ? `<ul class="lista notas-dia">${notasHoy.map(n => `<li class="${modoLectura ? '' : 'click'}" ${modoLectura ? '' : `data-act="editar-nota" data-id="${n.id}"`}>${ico('nota')}<span class="flex1">${esc(n.texto)}</span></li>`).join('')}</ul>`
            : `<div class="vacio">Sin notas para este día.</div>`}</section>

      <button class="iconbtn" data-act="dia" data-n="-7" aria-label="Semana anterior">${ico('izq')}</button><button class="iconbtn" data-act="dia" data-n="7" aria-label="Semana siguiente">${ico('der')}</button></div>
      <div class="semana">${semana}</div></section>
  </div>`;

/* En "Todos": una fila por pestaña con lo principal del día y del mes */
function resumenPorPestana(ctx, f) {
  const ini = f.slice(0, 8) + '01', fin = `${f.slice(0, 7)}-${pad(diasEnMes(anioDe(f), Number(f.slice(5, 7)) - 1))}`;
  const filas = pestanas().map(p => {
    const c = contexto(estado, p.id);
    const hoy = new Set(licenciasDelDia(f, c).map(l => l.agenteId)).size;
    const pend = c.licencias.filter(l => tramitesPendientes(l, c.arts.get(l.articuloId)).length).length;
    const mes = c.agentes.reduce((s, a) => s + diasAusencia(a.id, ini, fin, c, c.licencias), 0);
    return `<tr class="click" data-act="pestana" data-v="${esc(p.id)}"><td class="nombre">${esc(p.nombre)}${p.detalle ? ` <span class="small muted">· ${esc(p.detalle)}</span>` : ''}</td>
      <td class="num c">${c.agentes.filter(a => !a.inactivo).length}</td><td class="num c">${hoy || '—'}</td><td class="num c">${pend ? `<span class="chip warn">${pend}</span>` : '—'}</td><td class="num c hide-m">${mes || '—'}</td></tr>`;
  }).join('');
  return `<section class="card"><div class="card-h"><h2>Por pestaña</h2><span class="spacer"></span><span class="small muted">${esc(fmt(f))} · ${MESES[Number(f.slice(5, 7)) - 1].toLowerCase()}</span></div>
    <table class="t"><thead><tr><th>Pestaña</th><th class="num c">Personas</th><th class="num c">De licencia ese día</th><th class="num c">Trámites pendientes</th><th class="num c hide-m">Días hábiles ausente en el mes</th></tr></thead><tbody>${filas}</tbody></table></section>`;
}

function vistaAgentes(ctx) {

function listaAgentes(ctx) {
  const q = normalizar(ui.busqueda);
  const hoy = hoyISO();
  const ausentesHoy = new Set(licenciasDelDia(hoy, ctx).map(l => l.agenteId));
  // Totales del año completo, incluidas las licencias ya cargadas a futuro (igual que la ficha y los topes)
  const ini = `${ui.anio}-01-01`, fin = `${ui.anio}-12-31`;
  let ags = ctx.agentes.filter(a => ui.verInactivos || !a.inactivo);
  if (q) ags = ags.filter(a => normalizar([a.apellido, a.nombre, a.dni, a.cuil, ...vivos(a.cargos).map(c => [c.catedra, c.idCargo, c.cursoDiv, c.escuela].join(' '))].join(' ')).includes(q));
  const filas = ags.map(a => {
    const aus = diasAusencia(a.id, ini, fin, ctx);
    const usados = new Set(ctx.licTodas.filter(l => l.agenteId === a.id && l.hasta >= ini && l.desde <= fin).map(l => l.articuloId));
    const det = [...usados].map(id => ctx.arts.get(id)).filter(Boolean).sort(ordenArt)
      .map(art => ({ art, n: usoArticulo(a.id, art.id, ui.anio, ctx, { hastaFecha: fin }).total })).filter(x => x.n > 0);
    const exced = resumenAgente(a, ui.anio, fin, ctx).some(r => r.disponibles != null && r.disponibles < 0);
    return { a, det, aus, exced };
  });
  if (ui.orden === 'dias') filas.sort((x, y) => y.aus - x.aus || nombreAgente(x.a).localeCompare(nombreAgente(y.a)));
  else filas.sort((x, y) => nombreAgente(x.a).localeCompare(nombreAgente(y.a), 'es'));
  setTimeout(() => { const c = $('#cuenta-agentes'); if (c) c.textContent = plural(filas.length, 'agente'); });
  if (!ctx.agentes.length) return `<div class="vacio"><b>Todavía no hay personas cargadas${ctx.pes ? ' en ' + esc(nombrePestana(ctx.pes)) : ''}.</b>${modoLectura ? '' : 'Tocá "Nuevo agente" para cargar la primera. Si la persona ya está en otra pestaña, abrí su ficha y agregale un cargo acá.'}</div>`;
  if (!filas.length) return `<div class="vacio"><b>Ningún agente coincide con la búsqueda.</b>Probá con otro apellido o sacá los filtros.</div>`;
  return `<table class="t cards"><thead><tr>
    <th class="sortable" data-act="orden" data-v="nombre">Agente ${ui.orden === 'nombre' ? '▲' : ''}</th><th class="hide-m c">ID cargo</th><th class="hide-m">${ctx.pes ? (pestanaPorId(ctx.pes)?.tipo === 'escuelas' ? 'Escuela' : 'Cátedras en ' + esc(nombrePestana(ctx.pes))) : 'Cargos'}</th>
    <th class="num c sortable" data-act="orden" data-v="dias">Días ausente ${ui.orden === 'dias' ? '▼' : ''}</th><th>Por artículo</th></tr></thead><tbody>
    ${filas.map(({ a, det, aus, exced }) => {
      // En una pestaña se ven sólo los cargos de esa pestaña (y en qué otras está la persona)
      const c = ctx.pes ? cargosEn(a, ctx.pes) : vivos(a.cargos);
      const txtCargo = x => x.escuela ? x.escuela + (x.catedra ? ' · ' + x.catedra : '') : (x.catedra || x.idCargo || '—');
      return `<tr class="click" data-act="ver-agente" data-id="${a.id}">
        <td><span class="nombre">${esc(nombreAgente(a))}</span><div class="ag-meta">${a.dni ? `<span>DNI ${esc(Number(a.dni) ? n0(Number(a.dni)) : a.dni)}</span>` : ''}${ctx.pes ? chipsPestanas(pestanasDe(a), { menos: ctx.pes }) : chipsPestanas(pestanasDe(a))}${ausentesHoy.has(a.id) ? '<span class="chip hoy">de licencia hoy</span>' : ''}${exced ? '<span class="chip err">tope excedido</span>' : ''}${a.inactivo ? '<span class="chip">baja</span>' : ''}</div>
          ${c.length ? `<div class="solo-m small muted">${c.map(x => esc((x.idCargo ? 'ID ' + x.idCargo + ' · ' : '') + txtCargo(x))).join('<br>')}</div>` : ''}</td>
        <td class="hide-m ag-cargos ag-ids c">${c.length ? c.map(x => `<div>${x.idCargo ? esc(x.idCargo) : '<span>—</span>'}</div>`).join('') : '<span>—</span>'}</td>
        <td class="hide-m ag-cargos">${c.length ? c.map(x => { const sp = suplenciaDe(a, x, ctx); return `<div>${esc(txtCargo(x))}${x.caracter ? ` <span>· ${esc(x.caracter)}</span>` : ''}${sp ? `<span class="suple">${esc(sp)}</span>` : ''}</div>`; }).join('') : '<span>—</span>'}</td>
        <td class="num c dias-aus">${aus}</td>
        <td>${det.length ? `<div class="desglose">${det.map(x => `<span title="${esc(artNombre(x.art) + ': ' + x.n + ' ' + unidadTxt(x.art.unidad, x.n))}">${artBadge(x.art)}${x.n}</span>`).join('')}</div>` : '<span class="muted">—</span>'}</td></tr>`;
    }).join('')}</tbody></table>`;
}

/* ---------- Ficha del agente ---------- */
function vistaFicha(ctx) {
  const ag = ctx.agIdx.get(ui.agenteId);
  if (!ag) return `<div class="vacio"><b>No se encontró el agente.</b><a href="#agentes" data-act="ir" data-ruta="agentes">Volver a la lista</a></div>`;
  const anio = ui.anio;
  const hoy = hoyISO();
  const aFecha = ui.aFecha && anioDe(ui.aFecha) === anio ? ui.aFecha : (anioDe(hoy) === anio ? hoy : `${anio}-12-31`);
  const ini = `${anio}-01-01`;
  // Totales del año completo (incluye lo cargado después de la fecha del resumen) y lo que ya pasó
  const ausAnio = diasAusencia(ag.id, ini, `${anio}-12-31`, ctx);
  const ausHasta = diasAusencia(ag.id, ini, aFecha, ctx);
  const ausProg = ausAnio - ausHasta;
  const res = resumenAgente(ag, anio, aFecha, ctx);
  // La ficha es de la persona: muestra todas sus licencias, de todas las pestañas
  const lics = ctx.licTodas.filter(l => l.agenteId === ag.id && l.hasta >= ini && l.desde <= `${anio}-12-31`).sort((a, b) => a.desde.localeCompare(b.desde));
  const cargos = vivos(ag.cargos);
  const usados = res.filter(r => r.totalAnio > 0);
  return `<div class="stack">
    <div><a href="#agentes" class="small" data-act="ir" data-ruta="agentes">← Agentes</a></div>
    <div class="row"><h1>${esc(nombreAgente(ag))}</h1>${chipsPestanas(pestanasDe(ag))}${ag.inactivo ? '<span class="chip">Dado de baja</span>' : ''}${ag.ejemplo ? '<span class="chip">Ejemplo</span>' : ''}
      <span class="spacer"></span>
      ${modoLectura ? '' : `<button class="btn" data-act="editar-agente" data-id="${ag.id}">${ico('lapiz')}Editar datos</button>`}
      <button class="btn" data-act="imprimir-planilla" data-id="${ag.id}">${ico('imprimir')}Imprimir planilla</button>
      ${modoLectura ? '' : `<button class="btn accent" data-act="nueva-licencia" data-agente="${ag.id}">${ico('mas')}Licencia</button>`}</div>

function bloqueCiclo(ag, anio, aFecha, ctx) {
  const c = cicloDe(anio, ctx);
  if (!c) return `<p class="xs muted">${ico('info', 'sm')}Cargá el inicio y fin de clases de ${anio} en Ajustes → Calendario para ver los días de clase trabajados.</p>`;
  const total = diasClase(c.inicio, c.fin, ctx);
  const corte = aFecha < c.fin ? aFecha : c.fin;
  const van = corte < c.inicio ? 0 : diasClase(c.inicio, corte, ctx);
  const falto = corte < c.inicio ? 0 : faltasClase(ag.id, c.inicio, corte, ctx);
  const prog = faltasClase(ag.id, c.inicio, c.fin, ctx) - falto;
  const termino = corte === c.fin;
  return `<div class="small"><div class="lbl">Ciclo lectivo ${anio}: del ${fmtC(c.inicio)} al ${fmtC(c.fin)} · <b>${plural(total, 'día', 'días')} de clase</b></div>
    <div>${termino ? 'En el ciclo' : `Al ${fmtC(corte)} van <b>${van}</b> días de clase:`} trabajó <b>${van - falto}</b> y faltó <b>${falto}</b>${van ? ` (${Math.round(falto * 100 / van)}%)` : ''}.${prog ? ` <span class="muted">Tiene ${prog} más programado${prog === 1 ? '' : 's'}.</span>` : ''}</div></div>`;
}
function leyenda(ag, lics, ctx) {
  const grupos = [...new Set(lics.map(l => ctx.arts.get(l.articuloId)?.grupo).filter(Boolean))];
  return `<div class="leyenda">${grupos.map(g => `<span><i class="sw g-${g}"></i>${GRUPOS[g]}</span>`).join('')}
    ${tieneHorario(ag) ? '<span><i class="sw trab"></i>Días que trabaja</span>' : ''}<span><i class="sw finde"></i>Fin de semana</span><span><b class="f">F</b> feriado · <b class="f">A</b> asueto · <b class="f">N</b> no laborable</span></div>`;
}
function listaFeriados(anio, ctx, reg) {
  const fs = [...ctx.calIdx.values()].filter(c => anioDe(c.fecha) === anio && (!reg || !c.para || c.para === reg)).sort((a, b) => a.fecha.localeCompare(b.fecha));
  if (!fs.length) return `<span class="xs muted">Sin feriados cargados para ${anio} (se agregan en Ajustes).</span>`;
  return `<details class="feriados"><summary>Feriados y asuetos ${anio} (${fs.length})</summary><ul>${fs.map(c => `<li><b class="num">${fmtC(c.fecha)}</b> ${esc(TIPOS_DIA[c.tipo])}${esc(paraTxt(c))}: ${esc(c.desc)}</li>`).join('')}</ul></details>`;
}
function planillaAnual(ag, anio, ctx, { interactiva = true, imprimir = false } = {}) {
  const lics = ctx.licTodas.filter(l => l.agenteId === ag.id && l.hasta >= `${anio}-01-01` && l.desde <= `${anio}-12-31`);
  const porDia = new Map();
  for (const l of lics) {
    const a = l.desde < `${anio}-01-01` ? `${anio}-01-01` : l.desde, b = l.hasta > `${anio}-12-31` ? `${anio}-12-31` : l.hasta;
    for (let d = a; d <= b; d = sumarDias(d, 1)) { const prev = porDia.get(d); porDia.set(d, prev ? { l, sup: true } : { l, sup: false }); }
  }
  const hoy = hoyISO();
  let h = `<table class="planilla"><thead><tr><th class="mes">${imprimir ? '' : 'Mes'}</th>${Array.from({ length: 31 }, (_, i) => `<th>${pad(i + 1)}</th>`).join('')}<th class="obs izq">Observaciones</th></tr></thead><tbody>`;
  for (let m = 0; m < 12; m++) {
    const dm = diasEnMes(anio, m);
    h += `<tr><th class="mes">${MESES[m].toUpperCase()}</th>`;
    const obs = [];
    for (let d = 1; d <= 31; d++) {
      if (d > dm) { h += '<td class="nd"></td>'; continue; }
      const iso = `${anio}-${pad(m + 1)}-${pad(d)}`;
      const w = dow(iso); const fs = w === 0 || w === 6;
      const c = diaEspecial(iso, ctx, ag.regimen);
      if (c) obs.push(`${c.tipo} ${d}: ${c.desc}`);
      const x = porDia.get(iso);
      const cls = ['d']; let txt = '', title = `${DIAS_C[w]} ${fmt(iso)}`;
      if (fs) cls.push('fs');
      const turnos = turnosDelDia(ag, iso);
      if (turnos.length && !c) { cls.push('trab'); title += ` · Trabaja: ${textoTurnos(turnos)}`; }
      if (iso === hoy && !imprimir) cls.push('hoy');
      if (x) {
        const art = ctx.arts.get(x.l.articuloId);
        cls.push('g-' + (art?.grupo || 'sistema'));
        if (!cuentaDia(iso, art, ctx)) cls.push('nocuenta');
        if (x.sup) cls.push('sup');
        txt = codigoCorto(art);
        title += ` · Art. ${art?.codigo} ${artNombre(art)} (${fmt(x.l.desde)} al ${fmt(x.l.hasta)})${x.sup ? ' · SUPERPUESTA con otra licencia' : ''}`;
      } else if (c) { cls.push('fer'); txt = c.tipo; title += ` · ${TIPOS_DIA[c.tipo]}: ${c.desc}`; }
      const data = interactiva ? (x ? `data-act="editar-licencia" data-id="${x.l.id}"` : `data-act="licencia-desde" data-fecha="${iso}" data-agente="${ag.id}"`) : '';
      h += `<td class="${cls.join(' ')}" title="${esc(title)}" ${data}>${esc(txt)}</td>`;
    }
    h += `<td class="obs">${esc(obs.join(' · '))}</td></tr>`;
  }
  return h + '</tbody></table>';
}

function datosReporte(ctx) {
  const { desde, hasta, art } = ui.rep;
  // En una pestaña, sólo cuentan las licencias de esa pestaña (por ejemplo, un 20° b en otro CEPJA no)
  const lista = ctx.licencias.filter(l => l.hasta >= desde && l.desde <= hasta && (!art || l.articuloId === art))
    .map(l => { const ag = ctx.agIdx.get(l.agenteId); const a = ctx.arts.get(l.articuloId); return { l, ag, art: a, dias: diasLicencia(l, a, ctx, desde, hasta), faltan: tramitesPendientes(l, a) }; })
    .sort((a, b) => nombreAgente(a.ag).localeCompare(nombreAgente(b.ag), 'es') || a.l.desde.localeCompare(b.l.desde));
  const m = new Map();
  for (const x of lista) {
    if (!m.has(x.ag.id)) m.set(x.ag.id, { ag: x.ag, n: 0, det: new Map() });
    const r = m.get(x.ag.id); r.n++;
    const d = r.det.get(x.art.id) || { art: x.art, dias: 0 }; d.dias += x.dias; r.det.set(x.art.id, d);
  }
  const porAgente = [...m.values()].map(r => ({ ...r, det: [...r.det.values()].sort((a, b) => ordenArt(a.art, b.art)), aus: art ? r.det.get(art)?.dias || 0 : diasAusencia(r.ag.id, desde, hasta, ctx, ctx.licencias) }))
    .sort((a, b) => nombreAgente(a.ag).localeCompare(nombreAgente(b.ag), 'es'));
  // Días de clase del período (sólo si hay ciclo lectivo cargado) y asistencia de cada agente
  // (hasta hoy como máximo: los días que todavía no pasaron no cuentan como trabajados)
  const hoy = hoyISO(), corteClase = hasta < hoy ? hasta : hoy;
  const clase = corteClase >= desde ? diasClase(desde, corteClase, ctx) : 0;
  if (clase && !art) porAgente.forEach(r => { r.faltoClase = faltasClase(r.ag.id, desde, corteClase, ctx, ctx.licencias); r.trabajoClase = clase - r.faltoClase; });
  return { lista, porAgente, clase: art ? 0 : clase, corteClase };
}
function csv(filas) {
  const q = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  return '﻿' + filas.map(f => f.map(q).join(';')).join('\r\n');
}

let modalCerrar = null;
function abrirModal(html, { chico = false, alCerrar = null } = {}) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bg"><div class="modal ${chico ? 'sm' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  modalCerrar = alCerrar;
  const bg = root.firstElementChild;
  bg.addEventListener('mousedown', e => { if (e.target === bg) cerrarModal(); });
  setTimeout(() => { const f = root.querySelector('[autofocus]') || root.querySelector('input,select,textarea,button'); if (f) f.focus(); }, 30);
  return root.querySelector('.modal');
}
function cerrarModal(valor) { const cb = modalCerrar; modalCerrar = null; $('#modal-root').innerHTML = ''; if (cb) cb(valor); }
function confirmar({ titulo, html, ok = 'Aceptar', peligro = false }) {
  return new Promise(res => {
    const m = abrirModal(`<div class="modal-h"><h2>${esc(titulo)}</h2></div><div class="modal-b">${html}</div>
      <div class="modal-f"><span class="spacer"></span><button class="btn" data-x="no">Cancelar</button><button class="btn ${peligro ? 'danger' : 'primary'}" data-x="si" autofocus>${esc(ok)}</button></div>`, { chico: true, alCerrar: v => res(!!v) });
    m.querySelector('[data-x=no]').onclick = () => cerrarModal(false);
    m.querySelector('[data-x=si]').onclick = () => cerrarModal(true);
  });
}
let toastTimer = null;
function toast(texto, deshacer = null) {
  const r = $('#toast-root');
  r.innerHTML = `<div class="toast" role="status"><span>${esc(texto)}</span>${deshacer ? '<button data-x="undo">Deshacer</button>' : ''}</div>`;
  if (deshacer) r.querySelector('[data-x=undo]').onclick = () => { r.innerHTML = ''; deshacer(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { r.innerHTML = ''; }, deshacer ? 7000 : 3500);
}

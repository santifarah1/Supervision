    artSel.disabled = false;
    const arts = [...ctx.arts.values()].filter(a => a.regimen === ag.regimen).sort(ordenArt);
    const grupos = new Map();
    arts.forEach(a => { const g = a.capitulo || GRUPOS[a.grupo]; if (!grupos.has(g)) grupos.set(g, []); grupos.get(g).push(a); });
    // los usados por este agente este año, primero
    const usados = [...new Set(ctx.licencias.filter(l => l.agenteId === ag.id).sort((x, y) => y.desde.localeCompare(x.desde)).map(l => l.articuloId))].slice(0, 4).map(i => ctx.arts.get(i)).filter(a => a && a.regimen === ag.regimen);
    artSel.innerHTML = '<option value="">Elegí el artículo…</option>' +
      (usados.length ? `<optgroup label="Usados últimamente por este agente">${usados.map(a => `<option value="${a.id}">${esc(a.codigo)} — ${esc(artNombre(a))}</option>`).join('')}</optgroup>` : '') +
      [...grupos.entries()].map(([g, as]) => `<optgroup label="${esc(g)}">${as.map(a => `<option value="${a.id}">${esc(a.codigo)} — ${esc(artNombre(a))}</option>`).join('')}</optgroup>`).join('');
    if (prev && arts.some(a => a.id === prev)) artSel.value = prev;
  }
  function llenarCargos() {
    const ag = agenteActual(); const cs = ag ? vivos(ag.cargos) : [];
    F('cargos-wrap').hidden = cs.length < 2;
    const sel = b.cargos && b.cargos.length ? b.cargos : cs.map(c => c.id);
    F('cargos').innerHTML = cs.map(c => `<label class="check"><input type="checkbox" value="${c.id}" ${sel.includes(c.id) ? 'checked' : ''}> ${esc(c.catedra || c.idCargo || 'Cargo')} ${c.cursoDiv ? '· ' + esc(c.cursoDiv) : ''} ${c.hs ? '· ' + esc(c.hs) + ' hs' : ''}</label>`).join('');
  }
  function llenarTramites() {
    const art = ctx.arts.get(artSel.value);
    const ks = art?.tramites || [];
    F('tram-wrap').hidden = !ks.length;
    const marcados = {}; $$('input', F('tramites')).forEach(i => { marcados[i.value] = i.checked; });
    F('tramites').innerHTML = ks.map(k => `<label class="check"><input type="checkbox" value="${k}" ${(marcados[k] ?? b.tramites?.[k]) ? 'checked' : ''}> ${esc(tramLabel(k))}</label>`).join('');
  }
  function leer() {
    const ag = agenteActual();
    const cs = $$('input', F('cargos')).filter(i => i.checked).map(i => i.value);
    const tr = {}; $$('input', F('tramites')).forEach(i => { if (i.checked) tr[i.value] = true; });
    return { ...b, agenteId: ag ? ag.id : '', articuloId: artSel.value, desde: F('desde').value, hasta: F('hasta').value, cargos: ag && vivos(ag.cargos).length > 1 ? cs : [], tramites: tr, obs: F('obs').value.trim() };
  }
  function actualizar(origen) {
    const ctx2 = contexto();
    const art = ctx2.arts.get(artSel.value);
    F('unidad').textContent = art ? unidadTxt(art.unidad, 2) : 'días';
    const ay = F('ayuda');
    if (art) {
      ay.hidden = false;
      ay.innerHTML = `<b>Art. ${esc(art.codigo)} — ${esc(artNombre(art))}.</b> ${art.tiempo && art.tiempo !== '—' ? esc(art.tiempo) : ''}
        <div class="mt1">Cuenta en ${unidadTxt(art.unidad, 2)}${art.topeAnual != null ? ` · tope ${art.topeAnual} por año` : ''}${art.topeMensual != null ? ` · máx. ${art.topeMensual} por mes` : ''}${art.maxPorLicencia != null ? ` · hasta ${art.maxPorLicencia} por licencia` : ''}.</div>
        ${art.nombre !== artNombre(art) || art.reglamentacion ? `<details><summary>Texto completo y trámite</summary><div class="mt1">${esc(art.nombre)}.</div>${art.reglamentacion ? `<div class="mt1">${esc(art.reglamentacion)}</div>` : ''}</details>` : ''}`;
    } else ay.hidden = true;
    // cantidad ↔ hasta
    const desde = F('desde').value;
    if (origen === 'cant') {
      const n = parseEntero(F('cant').value);
      if (art && n >= 1 && esISO(desde)) { const h = calcularHasta(desde, n, art, ctx2); if (h) F('hasta').value = h; }
    } else if (art && esISO(desde) && esISO(F('hasta').value) && F('hasta').value >= desde) {
      if (origen === 'desde' && ultimaCant) { const h = calcularHasta(desde, ultimaCant, art, ctx2); if (h) F('hasta').value = h; }
      F('cant').value = diasLicencia({ desde, hasta: F('hasta').value }, art, ctx2);
    }
    const nCant = parseEntero(F('cant').value); ultimaCant = nCant >= 1 ? nCant : ultimaCant;
    const v = validarLicencia(leer(), ctx2);
    const ag = agenteActual();
    // plazo de la solicitud
    const lic = leer();
    const venc = art && esISO(lic.desde) && esISO(lic.hasta) ? vencimientoSolicitud(lic, art, ctx2) : null;
    F('plazo').textContent = venc ? `· Solicitud: ${venc.texto.toLowerCase()} (hasta el ${fmt(venc.fecha)})` : '';
    let h = '';
    if (!ag && agInput.value.trim()) h += `<div class="msg err">No encuentro ese agente. Elegilo de la lista que aparece al escribir.</div>`;
    if (art && esISO(lic.desde) && esISO(lic.hasta) && lic.hasta >= lic.desde) {
      h += `<div class="computo"><b>${v.dias}</b> ${unidadTxt(art.unidad, v.dias)} · del ${fmtLargo(lic.desde)} al ${fmtLargo(lic.hasta)}</div>`;
      const fer = []; for (let d = lic.desde; d <= lic.hasta && fer.length < 6; d = sumarDias(d, 1)) { const c = diaEspecial(d, ctx2, art.regimen); if (c) fer.push(`${fmtC(d)} ${c.desc}`); }
      if (fer.length && art.unidad === 'habiles') h += `<div class="small muted">No se cuentan: ${esc(fer.join(' · '))}.</div>`;
      const dt = ag ? diasDeTrabajoEn(lic, ag, ctx2) : null;
      if (dt != null) h += `<div class="small">Según su horario, le toca trabajar <b>${dt}</b> ${dt === 1 ? 'día' : 'días'} de ese período.</div>`;
    }
    h += v.errores.map(e => `<div class="msg err">${ico('alerta', 'sm')}<span>${esc(e)}</span></div>`).join('');
    h += v.avisos.map(e => `<div class="msg warn">${ico('alerta', 'sm')}<span>${esc(e)}</span></div>`).join('');
    h += v.info.map(e => `<div class="msg info">${ico('info', 'sm')}<span>${esc(e)}</span></div>`).join('');
    F('resumen').innerHTML = h || '<span class="muted small">Completá agente, artículo y fechas para ver el cómputo de días.</span>';
    const nA = v.avisos.length, nE = v.errores.length;
    F('pie').innerHTML = (v.dias && art ? `<b class="num">${v.dias}</b> ${unidadTxt(art.unidad, v.dias)} ` : '') + (nE ? `<span class="chip err">${plural(nE, 'error', 'errores')}</span> ` : '') + (nA ? `<span class="chip warn">${plural(nA, 'aviso')}</span>` : '');
    return v;
  }
  llenarArticulos(); llenarCargos(); llenarTramites();
  if (b.articuloId) artSel.value = b.articuloId;
  llenarTramites();
  actualizar('init');

  agInput.addEventListener('change', () => { llenarArticulos(); llenarCargos(); llenarTramites(); actualizar('ag'); });
  agInput.addEventListener('input', () => { if (agPorEtiqueta.has(agInput.value)) { llenarArticulos(); llenarCargos(); llenarTramites(); actualizar('ag'); artSel.focus(); } });
  artSel.addEventListener('change', () => { llenarTramites(); actualizar('art'); F('cant').focus(); });
  F('desde').addEventListener('change', () => actualizar('desde'));
  F('hasta').addEventListener('change', () => { ultimaCant = null; actualizar('hasta'); });
  F('cant').addEventListener('input', () => actualizar('cant'));
  F('cargos').addEventListener('change', () => actualizar('cargos'));

  function guardarLic(otra) {
    const v = actualizar('guardar');
    if (v.errores.length) { toast('Revisá los datos marcados en rojo.'); return; }
    const datos = leer();
    let guardada;
    mutar(e => {
      if (existente) {
        const l = e.licencias.find(x => x.id === existente.id);
        Object.assign(l, { agenteId: datos.agenteId, articuloId: datos.articuloId, desde: datos.desde, hasta: datos.hasta, cargos: datos.cargos, tramites: datos.tramites, obs: datos.obs });
        tocar(l); guardada = l;
      } else {
        guardada = sellar({ agenteId: datos.agenteId, articuloId: datos.articuloId, desde: datos.desde, hasta: datos.hasta, cargos: datos.cargos, tramites: datos.tramites, obs: datos.obs });
        e.licencias.push(guardada);
      }
    }, { msg: existente ? 'Licencia actualizada.' : `Licencia guardada: ${v.dias} ${unidadTxt(v.art.unidad, v.dias)}.` });
    if (otra) formLicencia({ agenteId: datos.agenteId, desde: sumarDias(datos.hasta, 1) });
    else cerrarModal();
  }
  m.querySelectorAll('[data-x=cerrar]').forEach(x => x.onclick = () => cerrarModal());
  m.querySelector('[data-x=guardar]').onclick = () => guardarLic(false);
  const otraBtn = m.querySelector('[data-x=otra]'); if (otraBtn) otraBtn.onclick = () => guardarLic(true);
  const borrarBtn = m.querySelector('[data-x=borrar]');
  if (borrarBtn) borrarBtn.onclick = async () => {
    const ctx3 = contexto(); const art = ctx3.arts.get(existente.articuloId); const ag = ctx3.agIdx.get(existente.agenteId);
    const d = diasLicencia(existente, art, ctx3);
    const ok = await confirmar({ titulo: 'Borrar licencia', html: `<p>Se borra la licencia <b>art. ${esc(art?.codigo)}</b> de <b>${esc(nombreAgente(ag))}</b> del ${fmt(existente.desde)} al ${fmt(existente.hasta)} (${d} ${unidadTxt(art?.unidad, d)}).</p>`, ok: 'Borrar licencia', peligro: true });
    if (!ok) return;
    mutar(e => { tocar(e.licencias.find(x => x.id === existente.id)).borrado = true; }, {
      msg: 'Licencia borrada.', deshacer: () => mutar(e => { tocar(e.licencias.find(x => x.id === existente.id)).borrado = false; }, { msg: 'Licencia recuperada.' }),
    });
  };
  m.addEventListener('keydown', e => { if (e.key === 'Enter' && e.ctrlKey) guardarLic(false); });
}

/* ---------- Notas por día (como el planificador semanal) ---------- */
function abrirNota({ id = null, fecha = null } = {}) {
  if (modoLectura) return;
  const ex = id ? estado.notas.find(n => n.id === id && !n.borrado) : null;
  const f = ex ? ex.fecha : (fecha || ui.fecha);
  const m = abrirModal(`<div class="modal-h"><h2>${ex ? 'Editar nota' : 'Nueva nota'}</h2><span class="spacer"></span><button class="iconbtn" data-x="cerrar" aria-label="Cerrar">${ico('x')}</button></div>
    <div class="modal-b">
      <label class="f">Día<input type="date" class="in" data-f="fecha" value="${esc(f)}"></label>
      <label class="f">Nota<textarea class="in" data-f="texto" rows="4" placeholder="Ej.: Reunión de personal 10 hs · Avisar a Pérez que traiga el certificado" autofocus>${esc(ex ? ex.texto : '')}</textarea></label>
      <div data-f="err"></div></div>
    <div class="modal-f">${ex ? '<button class="btn danger" data-x="borrar">Borrar</button>' : ''}<span class="spacer"></span><button class="btn" data-x="cerrar">Cancelar</button><button class="btn primary" data-x="guardar">Guardar nota</button></div>`, { chico: true });
  m.querySelectorAll('[data-x=cerrar]').forEach(b => b.onclick = () => cerrarModal());
  const guardarNota = () => {
    const fecha2 = m.querySelector('[data-f=fecha]').value, texto = m.querySelector('[data-f=texto]').value.trim();
    if (!esISO(fecha2) || !texto) { m.querySelector('[data-f=err]').innerHTML = `<div class="msg err">${ico('alerta', 'sm')}<span>Completá el día y el texto de la nota.</span></div>`; return; }
    cerrarModal();
    mutar(e => {
      if (!Array.isArray(e.notas)) e.notas = [];
      if (ex) { const n = e.notas.find(x => x.id === ex.id); n.fecha = fecha2; n.texto = texto; tocar(n); }
      else e.notas.push(sellar({ fecha: fecha2, texto }));
    }, { msg: ex ? 'Nota actualizada.' : 'Nota guardada.' });
  };
  m.querySelector('[data-x=guardar]').onclick = guardarNota;
  m.querySelector('[data-f=texto]').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) guardarNota(); });
  const bb = m.querySelector('[data-x=borrar]');
  if (bb) bb.onclick = () => {
    cerrarModal();
    mutar(e => { tocar(e.notas.find(x => x.id === ex.id)).borrado = true; }, { msg: 'Nota borrada.', deshacer: () => mutar(e => { tocar(e.notas.find(x => x.id === ex.id)).borrado = false; }, { msg: 'Nota recuperada.' }) });
  };
}

/* ---------- Formulario de agente ---------- */
function abrirFormAgente(id = null) {
  if (modoLectura) return;
  const existente = id ? estado.agentes.find(a => a.id === id && !a.borrado) : null;
  const a = existente ? structuredClone(existente) : { apellido: '', nombre: '', regimen: '233', cargos: [] };
  const cargos = vivos(a.cargos);
  if (!cargos.length) cargos.push({ id: uid(), catedra: '', hs: '', cursoDiv: '', idCargo: '', caracter: '', resDisp: '', alta: '', baja: '', obs: '' });
  const nLics = existente ? vivos(estado.licencias).filter(l => l.agenteId === id).length : 0;
  const campo = (k, label, extra = '') => `<label class="f">${label}<input class="in" data-a="${k}" value="${esc(a[k] || '')}" ${extra}></label>`;
  const filaCargo = c => `<div class="card plano card-b fgrid" data-cargo="${c.id}">
      <label class="f span2">Cargo / cátedra<input class="in" data-c="catedra" value="${esc(c.catedra)}" placeholder="Ej.: Ciencias de la Tierra I y II"></label>
      <label class="f">Horas<input class="in num" inputmode="numeric" data-c="hs" value="${esc(c.hs)}"></label>
      <label class="f">Curso y división<input class="in" data-c="cursoDiv" value="${esc(c.cursoDiv)}"></label>
      <label class="f">ID cargo<input class="in" data-c="idCargo" value="${esc(c.idCargo)}"></label>
      <label class="f">Carácter<select class="in" data-c="caracter"><option value=""></option>${(c.caracter && !CARACTERES.includes(c.caracter) ? [c.caracter, ...CARACTERES] : CARACTERES).map(x => `<option ${c.caracter === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></label>
      <label class="f">Res. / Disp.<input class="in" data-c="resDisp" value="${esc(c.resDisp)}"></label>
      <label class="f">Alta<input type="date" class="in" data-c="alta" value="${esc(c.alta)}"></label>
      <label class="f">Baja<input type="date" class="in" data-c="baja" value="${esc(c.baja)}"></label>
      <label class="f span2">Observaciones<input class="in" data-c="obs" value="${esc(c.obs)}"></label>
      <div class="full"><div class="lbl">Días y horario de trabajo <span class="xs muted">(marcá los días de cada turno; el horario es opcional)</span></div>
        ${TURNOS.map(([k, nombre]) => `<div class="hturno"><div class="hturno-t">${nombre}</div><div class="hgrid">${DIAS_SEMANA.map(d => {
          const h = ((c.horario || {})[d] || {})[k];
          return `<div class="hdia ${h ? 'on' : ''}" data-hdia="${d}" data-turno="${k}">
          <label><input type="checkbox" data-h="on" ${h ? 'checked' : ''}>${DIAS[d]}</label>
          <input type="time" class="in" data-h="desde" value="${esc(h?.desde || '')}" aria-label="${DIAS[d]} ${nombre}: entrada" ${h ? '' : 'disabled'}>
          <input type="time" class="in" data-h="hasta" value="${esc(h?.hasta || '')}" aria-label="${DIAS[d]} ${nombre}: salida" ${h ? '' : 'disabled'}></div>`; }).join('')}</div></div>`).join('')}</div>
      <div class="row al-fin"><button class="btn sm danger" type="button" data-x="quitar-cargo">Quitar cargo</button></div></div>`;
  const m = abrirModal(`<div class="modal-h"><h2>${existente ? 'Editar agente' : 'Nuevo agente'}</h2><span class="spacer"></span><button class="iconbtn" data-x="cerrar" aria-label="Cerrar">${ico('x')}</button></div>
    <div class="modal-b">
      <div class="fgrid">
        <label class="f">Apellido<input class="in" data-a="apellido" value="${esc(a.apellido)}" autofocus enterkeyhint="next"></label>
        <label class="f">Nombre<input class="in" data-a="nombre" value="${esc(a.nombre)}" enterkeyhint="next"></label>
        <label class="f">Régimen<select class="in" data-a="regimen" ${nLics ? 'disabled title="Tiene licencias cargadas: no se puede cambiar el régimen"' : ''}>${Object.entries(REGIMENES).map(([k, r]) => `<option value="${k}" ${a.regimen === k ? 'selected' : ''}>${r.largo}</option>`).join('')}</select></label>
        ${campo('dni', 'DNI', 'inputmode="numeric"')}${campo('cuil', 'CUIL', 'placeholder="20-12345678-9"')}
        ${campo('fechaNac', 'Fecha de nacimiento', 'type="date"')}
        ${campo('domicilio', 'Domicilio')}${campo('telefono', 'Teléfono', 'inputmode="tel"')}${campo('email', 'Email', 'type="email"')}
        ${campo('legajoPersonal', 'Legajo personal')}${campo('legajoJunta', 'Legajo de junta')}${campo('titulo', 'Título')}
        <label class="f full">Observaciones<textarea class="in" data-a="obs">${esc(a.obs || '')}</textarea></label>
        <label class="check full"><input type="checkbox" data-a="inactivo" ${a.inactivo ? 'checked' : ''}> Dado de baja / ya no trabaja en la institución (se oculta de la lista, pero conserva su historial)</label>
      </div>
      <div class="row"><h3>Cargos</h3><span class="spacer"></span><button class="btn sm" type="button" data-x="agregar-cargo">${ico('mas', 'sm')}Agregar cargo</button></div>
      <div class="stack" data-f="cargos">${cargos.map(filaCargo).join('')}</div>
      <div data-f="msgs"></div>
    </div>
    <div class="modal-f">${existente ? '<button class="btn danger" data-x="borrar">Borrar agente</button>' : ''}<span class="spacer"></span>
      <button class="btn" data-x="cerrar">Cancelar</button><button class="btn primary" data-x="guardar">${existente ? 'Guardar cambios' : 'Guardar agente'}</button></div>`);
  m.classList.add('ancho'); // el formulario de agente usa más ancho (cargos y turnos)
  m.querySelectorAll('[data-x=cerrar]').forEach(x => x.onclick = () => cerrarModal());
  m.querySelector('[data-x=agregar-cargo]').onclick = () => {
    const div = document.createElement('div'); div.innerHTML = filaCargo({ id: uid(), catedra: '', hs: '', cursoDiv: '', idCargo: '', caracter: '', resDisp: '', alta: '', baja: '', obs: '' });
    m.querySelector('[data-f=cargos]').appendChild(div.firstElementChild);
  };
  m.querySelector('[data-f=cargos]').addEventListener('click', e => { if (e.target.dataset.x === 'quitar-cargo') e.target.closest('[data-cargo]').remove(); });
  m.querySelector('[data-f=cargos]').addEventListener('change', e => {
    if (e.target.dataset.h !== 'on') return;
    const box = e.target.closest('[data-hdia]'); const on = e.target.checked;
    box.classList.toggle('on', on);
    $$('input[type=time]', box).forEach(i => { i.disabled = !on; });
    if (on) box.querySelector('[data-h=desde]').focus();
  });
  const leer = () => {
    const o = {}; $$('[data-a]', m).forEach(i => { o[i.dataset.a] = i.type === 'checkbox' ? i.checked : i.value.trim(); });
    o.cargos = $$('[data-cargo]', m).map(div => {
      const c = { id: div.dataset.cargo }; $$('[data-c]', div).forEach(i => { c[i.dataset.c] = i.value.trim(); });
      c.horario = {};
      $$('[data-hdia]', div).forEach(b => {
        if (!b.querySelector('[data-h=on]').checked) return;
        (c.horario[b.dataset.hdia] ||= {})[b.dataset.turno] = { desde: b.querySelector('[data-h=desde]').value, hasta: b.querySelector('[data-h=hasta]').value };
      });
      return c;
    }).filter(c => c.catedra || c.idCargo || c.hs || c.cursoDiv || c.alta || c.resDisp || Object.keys(c.horario).length);
    return o;
  };
  m.querySelector('[data-x=guardar]').onclick = () => {
    const o = leer();
    const err = [], av = [];
    if (!o.apellido) err.push('Falta el apellido.');
    if (!o.nombre) err.push('Falta el nombre.');
    if (o.dni && !/^\d{7,8}$/.test(o.dni.replace(/\./g, ''))) av.push('El DNI debería tener 7 u 8 números.');
    if (o.cuil && !/^\d{2}-?\d{7,8}-?\d$/.test(o.cuil)) av.push('El CUIL no tiene el formato 20-12345678-9.');
    const dni = o.dni.replace(/\./g, '');
    const dup = dni && vivos(estado.agentes).find(x => x.id !== id && (x.dni || '').replace(/\./g, '') === dni);
    if (dup) err.push(`Ya hay un agente con DNI ${dni}: ${nombreAgente(dup)}.`);
    o.cargos.forEach(c => {
      if (c.alta && c.baja && c.baja < c.alta) err.push(`En el cargo "${c.catedra || c.idCargo}", la baja es anterior al alta.`);
      Object.entries(c.horario).forEach(([d, porTurno]) => Object.entries(porTurno).forEach(([k, h]) => {
        const cuando = `el ${DIAS[d]} (${TURNOS.find(t => t[0] === k)[2]})`;
        if (h.desde && h.hasta && h.hasta <= h.desde) err.push(`En el cargo "${c.catedra || c.idCargo || 'sin nombre'}", ${cuando} la hora de salida es anterior a la de entrada.`);
        if (!!h.desde !== !!h.hasta) av.push(`En el cargo "${c.catedra || c.idCargo || 'sin nombre'}", ${cuando} tiene sólo una de las dos horas.`);
      }));
    });
    const msgs = m.querySelector('[data-f=msgs]');
    msgs.innerHTML = err.map(e => `<div class="msg err">${ico('alerta', 'sm')}<span>${esc(e)}</span></div>`).join('') + av.map(e => `<div class="msg warn">${ico('alerta', 'sm')}<span>${esc(e)}</span></div>`).join('');
    if (err.length) { msgs.scrollIntoView({ block: 'nearest' }); return; }
    if (av.length && !m.dataset.avisado) { m.dataset.avisado = '1'; msgs.insertAdjacentHTML('beforeend', '<div class="msg info">Si está bien así, tocá Guardar de nuevo.</div>'); return; }
    o.dni = dni;
    let nuevoId = id;
    mutar(e => {
      if (existente) {
        const ag = e.agentes.find(x => x.id === id);
        const viejos = new Map((ag.cargos || []).map(c => [c.id, c]));
        const nuevos = o.cargos.map(c => viejos.has(c.id) ? tocar(Object.assign(viejos.get(c.id), c)) : sellar(c));
        const quitados = (ag.cargos || []).filter(c => !o.cargos.some(n => n.id === c.id)).map(c => ({ ...c, borrado: true, modificado: ahora() }));
        Object.assign(ag, { ...o, regimen: nLics ? ag.regimen : o.regimen, cargos: [...nuevos, ...quitados] }); tocar(ag);
      } else {
        const ag = sellar({ ...o, cargos: o.cargos.map(c => sellar(c)) }); nuevoId = ag.id; e.agentes.push(ag);
      }
    }, { msg: existente ? 'Datos actualizados.' : 'Agente guardado.', redibujar: false });
    cerrarModal();
    if (!existente) ir('#agente/' + nuevoId); else render();
  };
  const bb = m.querySelector('[data-x=borrar]');
  if (bb) bb.onclick = async () => {
    const ok = await confirmar({ titulo: 'Borrar agente', html: `<p>Se borra a <b>${esc(nombreAgente(existente))}</b>${nLics ? ` y sus <b>${plural(nLics, 'licencia')}</b>` : ''}.</p><p class="small muted">Si dejó de trabajar en la institución, conviene marcarlo como "dado de baja" en lugar de borrarlo, así conserva el historial.</p>`, ok: 'Borrar agente', peligro: true });
    if (!ok) return;
    const t = ahora();
    mutar(e => { const ag = e.agentes.find(x => x.id === id); ag.borrado = true; ag.modificado = t; e.licencias.forEach(l => { if (l.agenteId === id && !l.borrado) { l.borrado = true; l.borradoCon = id; l.modificado = t; } }); }, {
      msg: 'Agente borrado.', redibujar: false,
      deshacer: () => mutar(e => { const ag = e.agentes.find(x => x.id === id); ag.borrado = false; tocar(ag); e.licencias.forEach(l => { if (l.borradoCon === id) { l.borrado = false; delete l.borradoCon; tocar(l); } }); }, { msg: 'Agente recuperado.' }),
    });
    ir('#agentes'); render();
  };
}

async function borrarEjemplo() {
  const n = vivos(estado.agentes).filter(a => a.ejemplo).length;
  const ok = await confirmar({ titulo: 'Borrar datos de ejemplo', html: `<p>Se borran los <b>${plural(n, 'agente')} de ejemplo</b> y sus licencias. Los datos reales no se tocan.</p>`, ok: 'Borrar ejemplos', peligro: true });
  if (!ok) return;
  mutar(e => {
    const ids = new Set(e.agentes.filter(a => a.ejemplo).map(a => a.id));

    e.licencias = e.licencias.filter(l => !ids.has(l.agenteId));
    e.notas = (e.notas || []).filter(n => !n.ejemplo);

// Combobox de agentes: lista propia debajo del campo. Al elegir, escribe la misma etiqueta
// que antes ponía la lista del navegador y dispara 'input' y 'change', así la lógica no cambia.
const Combo = {
  pop: null, input: null, items: [], idx: -1,
  abrir(input) {
    this.input = input; if (!this.pop) { this.pop = document.createElement('div'); this.pop.className = 'combo-pop'; this.pop.setAttribute('role', 'listbox'); document.body.appendChild(this.pop); }
    this.filtrar(); input.setAttribute('aria-expanded', 'true');
  },
  filtrar() {
    const q = normalizar(this.input.value);
    const ags = contexto().agentes.filter(a => !a.inactivo).sort((a, b) => nombreAgente(a).localeCompare(nombreAgente(b), 'es'));
    const exacto = ags.some(a => etiquetaAgente(a) === this.input.value);
    this.items = (q && !exacto) ? ags.filter(a => normalizar(etiquetaAgente(a)).includes(q)) : ags;
    // Nada queda resaltado de entrada: el verde sigue al mouse o a las flechas.
    // Sólo al escribir en la carga de licencia se marca el primero, para que Enter lo elija.
    this.idx = (q && !exacto && !this.input.hasAttribute('data-combo-libre') && this.items.length) ? 0 : -1;
    this.pintar();
  },
  pintar() {
    if (!this.pop) return;
    const actual = this.input.value;
    this.pop.innerHTML = this.items.length ? this.items.map((a, i) => { const sel = etiquetaAgente(a) === actual;
      return `<div class="op ${i === this.idx ? 'on' : ''} ${sel ? 'sel' : ''}" role="option" aria-selected="${sel}" data-i="${i}"><span class="tilde">${sel ? ico('check') : ''}</span>${esc(nombreAgente(a))}<small>${REGIMENES[a.regimen]?.corto || ''}</small></div>`; }).join('')
      : '<div class="vacio-op">Ningún agente coincide.</div>';
    const r = this.input.getBoundingClientRect();
    const ancho = Math.max(r.width, 300), izq = Math.max(8, Math.min(r.left, window.innerWidth - ancho - 8));
    Object.assign(this.pop.style, { left: izq + 'px', top: (r.bottom + 6) + 'px', width: ancho + 'px', display: 'block' });
    this.marcar(true);
  },
  // Mueve el resaltado sin redibujar la lista (así sigue al mouse sin saltos)
  marcar(desplazar = false) {
    if (!this.pop) return;
    this.pop.querySelectorAll('.op').forEach(op => op.classList.toggle('on', Number(op.dataset.i) === this.idx));
    const on = this.pop.querySelector('.op.on'); if (on && desplazar) on.scrollIntoView({ block: 'nearest' });
  },
  // Con las flechas se arranca desde el agente elegido, si hay uno
  mover(paso) {
    if (!this.items.length) return;
    if (this.idx < 0) { const sel = this.items.findIndex(a => etiquetaAgente(a) === this.input.value); this.idx = sel >= 0 ? sel : (paso > 0 ? -1 : this.items.length); }
    this.idx = Math.max(0, Math.min(this.items.length - 1, this.idx + paso));
    this.marcar(true);
  },
  elegir(i) {
    const a = this.items[i]; if (!a || !this.input) return;
    this.input.value = etiquetaAgente(a);
    this.input.dispatchEvent(new Event('input', { bubbles: true }));
    this.input.dispatchEvent(new Event('change', { bubbles: true }));
    this.cerrar();
  },
  cerrar() { if (this.pop) this.pop.style.display = 'none'; if (this.input) this.input.setAttribute('aria-expanded', 'false'); this.input = null; },
};

      if (cred && e.code === 'permission-denied') { await cred.user.delete().catch(() => {}); this.registrando = false; this.alCambiarSesion(null); throw new Error('El código de la escuela no es correcto.'); }
      this.registrando = false;
      if (cred && e.code === 'tiempo') { this.alCambiarSesion(null); await this.fb.signOut(this.auth).catch(() => {}); throw new Error(MSJ_SIN_SERVIDOR + ' Tu cuenta quedó creada: cuando haya conexión, entrá por "Ingresar" con el mismo mail y contraseña para terminar.'); }
      if (cred) this.alCambiarSesion(cred.user);
      throw e;
    }
    this.registrando = false;
    await this.alCambiarSesion(this.auth.currentUser);
  },
  async completarPerfil(datos) { // quien entró con Google (o perdió su perfil) y todavía no se registró
    try { await this.crearPerfil(this.usuario, datos); }
    catch (e) { if (e.code === 'permission-denied') throw new Error('El código de la escuela no es correcto.'); throw e; }
    await this.alCambiarSesion(this.usuario);
  },
  crearPerfil(user, { nombre, rol, codigo }) {
    const f = this.fb;
    // Si el servidor no confirma en 20 segundos, se avisa en vez de quedar esperando para siempre
    return conTiempo(f.setDoc(f.doc(this.db, 'usuarios', user.uid), {
      nombre: nombre.trim(), email: user.email, rol, activo: true,
      codigo: normalizarCodigo(codigo), creado: f.serverTimestamp(),
    }), 20000);
  },
  // ----- Administración (sólo el admin; las reglas del servidor lo controlan) -----
  esAdmin() { return this.estado === 'ok' && this.perfil?.rol === 'admin'; },
  async cargarAdmin() {
    if (this.cargandoAdmin) return;
    this.cargandoAdmin = true;
    try {
      const f = this.fb;
      const [us, cod] = await Promise.all([f.getDocs(f.collection(this.db, 'usuarios')), f.getDoc(f.doc(this.db, 'config', 'acceso'))]);
      this.usuarios = us.docs.map(d => ({ uid: d.id, ...d.data() }));
      this.codigo = cod.exists() ? cod.data().codigo : '';
    } catch (e) { this.usuarios = []; this.codigo = ''; toast(mensajeNube(e)); }
    this.cargandoAdmin = false;
    render();
  },
  async actualizarUsuario(uid, cambios) {
    await this.fb.updateDoc(this.fb.doc(this.db, 'usuarios', uid), cambios);
    const u = this.usuarios?.find(x => x.uid === uid); if (u) Object.assign(u, cambios);
  },
  async guardarCodigo(c) {
    await this.fb.setDoc(this.fb.doc(this.db, 'config', 'acceso'), { codigo: c });
    this.codigo = c;
  },
};

/* ---------- Etapa 3: los datos en el servidor ----------
   Cada agente, licencia, nota, artículo y día del calendario es un documento aparte en
   datos/{colección}/registros/{id}. La configuración (ciclos, feriados como hábiles, versión)
   va en datos/config/registros/general.
   La app sigue trabajando con el mismo objeto "estado" de siempre: al guardar se suben sólo
   los registros que cambiaron, y los cambios de otras personas llegan solos y se redibuja.
   Sin internet se sigue trabajando: Firestore guarda los cambios y los sube al volver. */
const COLECCIONES = ['agentes', 'licencias', 'notas', 'articulos', 'calendario'];
const NubeDatos = {
  subs: [], sync: new Map(), recibidos: new Set(), listo: false, generalExiste: false,
  pendientes: 0, error: '', renderPendiente: false,

  activos() { return Nube.activa() && Nube.estado === 'ok'; },
  conectar() {
    this.desconectar();
    const f = Nube.fb, db = Nube.db;
    estado = estadoVacio();
    this.sync = new Map(); this.recibidos = new Set(); this.listo = false; this.generalExiste = false; this.error = '';
    this.subs.push(f.onSnapshot(f.doc(db, 'datos', 'config', 'registros', 'general'), s => {
      this.generalExiste = s.exists();
      if (s.exists()) {
        const d = s.data();
        this.sync.set('general', JSON.stringify(d));
        estado.version = d.version || estado.version;
        estado.config = { ...estado.config, ...(d.config || {}) };
        Object.assign(estado.meta, d.meta || {});
      }
      this.recibido('general');
    }, e => this.falla(e)));
    for (const col of COLECCIONES) {
      this.subs.push(f.onSnapshot(f.collection(db, 'datos', col, 'registros'), s => {
        for (const ch of s.docChanges()) {
          const id = ch.doc.id, key = col + '/' + id;
          const arr = estado[col];
          const i = arr.findIndex(r => r.id === id);
          if (ch.type === 'removed') { if (i >= 0) arr.splice(i, 1); this.sync.delete(key); continue; }
          const d = ch.doc.data();
          this.sync.set(key, JSON.stringify(d));
          if (i >= 0) arr[i] = d; else arr.push(d);
        }
        this.recibido(col);
      }, e => this.falla(e)));
    }
  },
  desconectar() { this.subs.forEach(u => { try { u(); } catch (e) { /* ya cerrada */ } }); this.subs = []; this.listo = false; },
  falla(e) { this.error = mensajeNube(e); this.listo = true; this.redibujar(); },
  recibido(parte) {
    this.recibidos.add(parte);
    if (!this.listo && this.recibidos.size === COLECCIONES.length + 1) { this.listo = true; this.alEstarListo(); }
    if (this.listo) guardarCopiaEnCompu();
    this.redibujar();
  },
  // Primera carga completa: si la base está vacía se siembran artículos y feriados; si es de una versión vieja, se migra.
  alEstarListo() {
    if (!puedeCargarNube()) return;
    if (!this.generalExiste) {
      if (!estado.articulos.length) {
        const ini = estadoInicial();
        estado.articulos = ini.articulos; estado.calendario = vivos(estado.calendario).length ? estado.calendario : ini.calendario;
      }
      this.subir();
    } else if ((estado.version || 1) < SCHEMA_VERSION) {
      estado = migrar(estado, { persistir: false });
      this.subir();
    }
  },
  // Redibuja sin cortar a quien está escribiendo en un campo de la pantalla
  redibujar() {
    if (this.renderPendiente) return;
    this.renderPendiente = true;
    requestAnimationFrame(() => {
      this.renderPendiente = false;
      const a = document.activeElement;
      if (a && a.closest && a.closest('#main') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && this.listo) {
        a.addEventListener('blur', () => this.redibujar(), { once: true });
        return;
      }
      render();
    });
  },
  // Sube sólo lo que cambió respecto de lo último que se vio en el servidor
  subir() {
    if (!this.listo || !puedeCargarNube()) return;
    const f = Nube.fb, db = Nube.db, ops = [], vistos = new Set();
    for (const col of COLECCIONES) {
      for (const r of estado[col] || []) {
        if (!r || !r.id) continue;
        const key = col + '/' + r.id, j = JSON.stringify(r);
        vistos.add(key);
        if (this.sync.get(key) !== j) { ops.push({ ref: f.doc(db, 'datos', col, 'registros', r.id), datos: JSON.parse(j) }); this.sync.set(key, j); }
      }
    }
    for (const key of [...this.sync.keys()]) {
      if (key === 'general' || vistos.has(key)) continue;
      const [col, id] = key.split('/');
      ops.push({ ref: f.doc(db, 'datos', col, 'registros', id), borrar: true }); this.sync.delete(key);
    }
    guardarCopiaEnCompu();
    const g = datosGenerales(), jg = JSON.stringify(g);
    if (this.sync.get('general') !== jg) { ops.push({ ref: f.doc(db, 'datos', 'config', 'registros', 'general'), datos: JSON.parse(jg) }); this.sync.set('general', jg); }
    for (let i = 0; i < ops.length; i += 400) {
      const lote = f.writeBatch(db);
      ops.slice(i, i + 400).forEach(o => o.borrar ? lote.delete(o.ref) : lote.set(o.ref, o.datos));
      this.pendientes++; pintarEstadoGuardado();
      lote.commit().then(() => { this.error = ''; }, e => { this.error = mensajeNube(e); renderBanners(); })
        .finally(() => { this.pendientes--; pintarEstadoGuardado(); });
    }
  },
};
/* Copia de respaldo en esta compu: todo lo de la nube, a lo sumo cada 20 segundos.
   Si un día no anda el servidor, se puede seguir trabajando con ella (modo emergencia). */
let copiaPendiente = null;
function guardarCopiaEnCompu() {
  if (!NubeDatos.activos() || !NubeDatos.listo || copiaPendiente) return;
  copiaPendiente = setTimeout(() => {
    copiaPendiente = null;
    if (!NubeDatos.activos() || !NubeDatos.listo || !vivos(estado.articulos).length) return;
    try { LS.setItem(COPIA_NUBE_KEY, JSON.stringify({ fecha: ahora(), nombre: Nube.perfil?.nombre || '', rol: Nube.perfil?.rol || '', estado })); }
    catch (e) { /* sin espacio: se intenta en el próximo cambio */ }
  }, 20000);
}
function leerCopiaEnCompu() {
  try { const c = JSON.parse(LS.getItem(COPIA_NUBE_KEY) || 'null'); return c && esEstadoValido(c.estado) ? c : null; } catch (e) { return null; }
}
function entrarEmergencia() {
  const c = leerCopiaEnCompu(); if (!c) return toast('No hay una copia guardada en esta compu.');
  // Si ya se trabajó en modo emergencia en esta compu, se sigue con eso (no se pisa lo cargado)
  if (!LS.getItem('licencias-personal-emergencia')) {
    LS.setItem('licencias-personal-emergencia', JSON.stringify(c.estado));
    LS.setItem(EMERGENCIA_INFO_KEY, JSON.stringify({ fecha: c.fecha, nombre: c.nombre, rol: c.rol }));
  }
  location.href = location.pathname + '?emergencia';
}
function puedeCargarNube() { return NubeDatos.activos() && ['admin', 'carga'].includes(Nube.perfil?.rol); }
function estadoVacio() {
  const t = ahora();
  return { version: SCHEMA_VERSION, meta: { institucion: INSTITUCION, creado: t, modificado: t, rev: 0, ultimoBackup: null, semillaArticulos: 1 },
    config: { feriadosCuentanHabiles: false }, articulos: [], calendario: [], agentes: [], licencias: [], notas: [] };
}
// Lo que va al documento "general": sin los contadores que cambian en cada guardado
function datosGenerales() {
  const { rev, modificado, ...meta } = estado.meta || {};
  return { version: estado.version, config: estado.config || {}, meta };
}

const MSJ_SIN_SERVIDOR = 'No se pudo conectar con la base de datos de la escuela. Revisá la conexión a internet y probá de nuevo. Si sigue pasando con internet andando, puede ser un antivirus o un filtro de la red que bloquea la conexión.';
/* Espera una respuesta del servidor como mucho "ms" milisegundos */
function conTiempo(promesa, ms) {
  let t;
  const corte = new Promise((_, rej) => { t = setTimeout(() => rej(Object.assign(new Error(MSJ_SIN_SERVIDOR), { code: 'tiempo' })), ms); });
  return Promise.race([promesa, corte]).finally(() => clearTimeout(t));
}
function normalizarCodigo(c) { return String(c || '').trim().toUpperCase().replace(/\s+/g, ''); }
function generarCodigo() {
  const letras = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sin 0/O ni 1/I/L para que no se confundan
  const r = crypto.getRandomValues(new Uint8Array(8));
  const s = Array.from(r, n => letras[n % letras.length]).join('');
  return `ESRN-${s.slice(0, 4)}-${s.slice(4)}`;
}
function mensajeNube(e) {
  const c = e?.code || '';
  const m = {
    'auth/invalid-credential': 'El mail o la contraseña no son correctos.',
    'auth/wrong-password': 'El mail o la contraseña no son correctos.',
    'auth/user-not-found': 'No hay ninguna cuenta con ese mail.',
    'auth/invalid-email': 'El mail no es válido.',
    'auth/missing-email': 'Escribí tu mail.',
    'auth/missing-password': 'Escribí tu contraseña.',
    'auth/email-already-in-use': 'Ya hay una cuenta con ese mail. Ingresá con tu contraseña (o tocá "Olvidé mi contraseña").',
    'auth/weak-password': 'La contraseña tiene que tener al menos 6 caracteres.',
    'auth/too-many-requests': 'Demasiados intentos. Esperá unos minutos y probá de nuevo.',
    'auth/network-request-failed': 'No hay conexión a internet. Revisá la conexión y probá de nuevo.',
    'auth/popup-blocked': 'El navegador bloqueó la ventana de Google. Permití las ventanas emergentes para este sitio.',
    'auth/account-exists-with-different-credential': 'Ese mail ya tiene una cuenta con contraseña. Ingresá con el mail y la contraseña.',
    'permission-denied': 'No tenés permiso para hacer eso.',
    'unavailable': 'No hay conexión con el servidor. Probá de nuevo en un momento.',
    'tiempo': MSJ_SIN_SERVIDOR,
  };
  return m[c] || e?.message || 'Ocurrió un error. Probá de nuevo.';
}

/* Aplica el estado de la sesión: tipo de usuario, modo consulta y qué se muestra */
function aplicarSesion() {
  const dentro = !Nube.activa() || Nube.estado === 'ok';

  document.body.classList.toggle('sin-sesion', !dentro);

const ICONO_GOOGLE = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h6a5.1 5.1 0 0 1-2.2 3.4v2.8h3.6c2.1-2 3.2-4.8 3.2-8.2z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.4-2.7l-3.6-2.8c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 14c-.2-.7-.4-1.4-.4-2s.1-1.4.4-2V7.1H2a11 11 0 0 0 0 9.8l3.7-2.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2A11 11 0 0 0 2 7.1L5.7 10c.9-2.7 3.4-4.6 6.3-4.6z"/></svg>';

async function ingresoAccion(fn, { exito = '' } = {}) {
  ingreso.ocupado = true; ingreso.error = ''; ingreso.aviso = ''; render();
  try { await fn(); if (exito) ingreso.aviso = exito; }
  catch (e) { if (e?.code !== 'auth/popup-closed-by-user' && e?.code !== 'auth/cancelled-popup-request') ingreso.error = mensajeNube(e); }
  ingreso.ocupado = false; render();
}
function leerFormIngreso(f) {

  for (const [k, val] of fd.entries()) o[k] = String(val);
  const { clave, ...resto } = o; Object.assign(ingreso.campos, resto); // la contraseña no se guarda
  return o;
}
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form^="ingreso-"]'); if (!f) return;
  e.preventDefault();
  const d = leerFormIngreso(f);
  const tipo = f.dataset.form;
  if (tipo === 'ingreso-entrar') ingresoAccion(() => Nube.ingresar(d.email, d.clave));
  if (tipo === 'ingreso-registro') {
    if (!normalizarCodigo(d.codigo)) { ingreso.error = 'Falta el código de la escuela.'; render(); return; }
    ingresoAccion(() => Nube.registrar(d));
  }
  if (tipo === 'ingreso-perfil') ingresoAccion(() => Nube.completarPerfil(d));
});

      ${p.rol === 'consulta' ? '<p class="small muted">Podés ver todo, pero no modificar. Si necesitás cargar licencias, pedíselo a quien administra la app.</p>' : ''}
      <p class="xs muted">Esta compu guarda una copia de los datos por si algún día no anda el servidor. Si es una compu compartida, usá "Salir y borrar esta compu".</p></div>
    <div class="modal-f"><button class="btn sm" data-x="salir-borrar">Salir y borrar esta compu</button><span class="spacer"></span><button class="btn" data-x="no">Cerrar</button><button class="btn danger" data-x="salir">Salir</button></div>`, { chico: true });
  m.querySelectorAll('[data-x=no]').forEach(b => { b.onclick = () => cerrarModal(); });
  m.querySelector('[data-x=salir]').onclick = async () => { cerrarModal(); ingreso.campos = {}; ingreso.tab = 'entrar'; await Nube.salir(); };
  m.querySelector('[data-x=salir-borrar]').onclick = async () => { cerrarModal(); ingreso.campos = {}; ingreso.tab = 'entrar'; await Nube.salir(true); };
}

/* ---------- Ajustes → Usuarios (sólo administra) ---------- */
function ajustesUsuarios() {
  if (!Nube.esAdmin()) return '<div class="vacio">Sólo quien administra la app ve esta sección.</div>';
  if (Nube.usuarios === null) { setTimeout(() => Nube.cargarAdmin()); return '<div class="card card-b muted">Cargando usuarios…</div>'; }
  const yo = Nube.usuario.uid;
  const us = [...Nube.usuarios].sort((a, b) => (b.activo - a.activo) || String(a.nombre).localeCompare(String(b.nombre), 'es'));
  return `<div class="stack">
    <section class="card"><div class="card-h"><h2>Código de la escuela</h2></div><div class="card-b stack">
      <p class="small">Para crear su cuenta, cada persona tiene que poner este código. Pasáselo sólo al personal de la escuela. Si se filtra, generá uno nuevo: las cuentas que ya existen siguen funcionando.</p>
      <div class="row"><code class="codigo">${Nube.codigo ? esc(Nube.codigo) : 'Todavía no hay código: nadie se puede registrar.'}</code>
        ${Nube.codigo ? '<button class="btn sm" data-act="codigo-copiar">Copiar</button>' : ''}
        <button class="btn sm" data-act="codigo-nuevo">${Nube.codigo ? 'Generar uno nuevo' : 'Generar código'}</button></div>
    </div></section>
    <section class="card"><div class="card-h"><h2>Usuarios</h2><span class="chip">${us.filter(u => u.activo).length} activos</span><span class="spacer"></span><button class="btn sm" data-act="usuarios-recargar">Actualizar</button></div>
      <table class="t"><thead><tr><th>Nombre</th><th class="hide-m">Mail</th><th>Tipo</th><th class="c">Acceso</th></tr></thead><tbody>
      ${us.map(u => `<tr><td class="nombre">${esc(u.nombre)}${u.uid === yo ? ' <span class="chip">vos</span>' : ''}</td><td class="hide-m small">${esc(u.email)}</td>
        <td>${u.uid === yo ? esc(ROLES[u.rol]) : `<select class="in w-auto" data-on="usuario-rol" data-uid="${u.uid}">${Object.entries(ROLES).map(([k, n]) => `<option value="${k}" ${u.rol === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`}</td>
        <td class="c">${u.uid === yo ? '<span class="chip ok">Activo</span>' : `<button class="btn sm ${u.activo ? 'danger' : ''}" data-act="usuario-activo" data-uid="${u.uid}">${u.activo ? 'Dar de baja' : 'Reactivar'}</button>`}</td></tr>`).join('')}
      </tbody></table></section></div>`;
}

async function init() {
  if (EN_EMERGENCIA) {
    estado = cargarLocal(); guardarLocal();
    const info = (() => { try { return JSON.parse(LS.getItem(EMERGENCIA_INFO_KEY) || '{}'); } catch (e) { return {}; } })();
    if (info.rol === 'consulta') { modoLectura = true; Consulta.estado = 'emergencia'; }
    render();
    return;
  }
  Nube.preparar();
  if (Nube.activa()) {
    // Con la nube, los datos vienen del servidor al iniciar sesión (no del navegador)
    estado = estadoVacio();
    Nube.iniciar();
    return;
  }
  if (LS.getItem(MODO_KEY) === 'consulta') {
    modoLectura = true; estado = estadoInicial(); Consulta.estado = 'cargando';
    try { Consulta.handle = await idbGet('consulta'); } catch (e) { Consulta.handle = null; }
    if (Consulta.handle) { Consulta.estado = 'requiere-permiso'; render(); await cargarConsulta(false); }
    else { Consulta.estado = 'error: elegí el archivo de datos compartido.'; render(); }
    return;
  }
  estado = cargarLocal();
  guardarLocal(); // deja persistida cualquier migración de versión
  render();
  if (Archivo.soportado) await reconectarArchivo(false);
}
init();
</script>

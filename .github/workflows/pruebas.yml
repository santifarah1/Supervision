# Corre las pruebas automáticas en cada PR (y en main), para enterarse antes
# de publicar si un cambio rompió algún cálculo, la nube o las reglas.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # El emulador de Firestore necesita Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Correr las pruebas
        run: npm test
        env:
          TZ: America/Argentina/Buenos_Aires
